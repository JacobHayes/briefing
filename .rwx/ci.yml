on:
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      branch: ${{ event.git.branch }}
  github:
    push:
      if: ${{ event.git.tag == '' }}
      init:
        commit-sha: ${{ event.git.sha }}
        branch: ${{ event.git.branch }}

# A newer push to the same branch supersedes a running CI run.
concurrency-pools:
  - id: JacobHayes/briefing:ci-${{ init.branch }}
    capacity: 1
    on-overflow: cancel-running

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: code
    call: git/clone 2.1.0
    with:
      repository: https://github.com/JacobHayes/briefing.git
      ref: ${{ init.commit-sha }}

  # Rust + mise tools and the dependency fetch (shared with release.yml).
  - key: toolchain
    use: code
    call: ${{ run.dir }}/packages/toolchain.yml

  - key: check
    use: toolchain
    run: mise run check
    filter:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - rustfmt.toml
      - mise.toml
      - build.rs
      - src/**/*
      - tests/**/*
      - assets/**/*
      - skills/**/* # a test checks SKILL.md against the binary's limits

  - key: build
    use: toolchain
    parallel:
      matrix:
        target: [aarch64-apple-darwin, aarch64-unknown-linux-musl, x86_64-unknown-linux-musl]
    run: |
      cargo zigbuild --release --locked --target "$TARGET"
      mkdir -p "$RWX_ARTIFACTS/briefing-$TARGET"
      cp "target/$TARGET/release/briefing" "$RWX_ARTIFACTS/briefing-$TARGET/"
    env:
      TARGET: ${{ parallel.target }}
    filter:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - mise.toml
      - build.rs
      - src/**/*
      - assets/**/*
