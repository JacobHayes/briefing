on:
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      branch: ${{ event.git.branch }}
  github:
    push:
      if: ${{ event.git.tag == '' }}
      init:
        commit-sha: ${{ event.git.sha }}
        branch: ${{ event.git.branch }}

# A newer push to the same branch supersedes a running CI run.
concurrency-pools:
  - id: JacobHayes/briefing:ci-${{ init.branch }}
    capacity: 1
    on-overflow: cancel-running

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: code
    call: git/clone 2.1.0
    with:
      repository: https://github.com/JacobHayes/briefing.git
      ref: ${{ init.commit-sha }}

  # Rust + mise tools and the dependency fetch (shared with release.yml).
  - key: toolchain
    use: code
    call: ${{ run.dir }}/packages/toolchain.yml

  - key: check
    use: toolchain
    run: |
      set -euo pipefail
      mise run check
      if ! git diff --exit-code; then
        echo "mise run check changed tracked files; run it locally and commit the diff" >&2
        exit 1
      fi
      untracked="$(git ls-files --others --exclude-standard)"
      if [ -n "$untracked" ]; then
        echo "mise run check created untracked files:" >&2
        echo "$untracked" >&2
        exit 1
      fi
    filter:
      - Cargo.toml
      - Cargo.lock
      - rustfmt.toml
      - mise.toml
      - mise.lock
      - build.rs
      - src/**/*
      - tests/**/*
      - assets/**/*
      - integrations/**/*
      - skills/**/* # regenerated by `mise run check`

  # Same packaging as a release, minus the version (see packages/build.yml).
  - key: build
    use: toolchain
    call: ${{ run.dir }}/packages/build.yml

  - key: package-check
    use: toolchain.tools
    after: [build]
    env:
      ASSETS: ${{ tasks.build.tasks.build.artifacts.dist }}
    run: |
      set -euo pipefail
      # One subdirectory per matrix leg.
      find "$ASSETS" -type f | sort
      for sums in "$ASSETS"/*/*.sha256; do (cd "$(dirname "$sums")" && sha256sum -c "$(basename "$sums")"); done
      tar tzf "$ASSETS"/*/briefing-x86_64-unknown-linux-musl.tar.gz
