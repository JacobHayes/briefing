# Toolchain + dependency layers shared by ci.yml and release.yml (RWX local package). Call it
# with `use: code` so the tasks see the checkout; callers then `use: toolchain` (both layers) or
# `use: toolchain.tools`.
package: true

tasks:
  # Everything mise.toml declares: rust (+ components, targets), zig, cargo-zigbuild, node.
  - key: tools
    use: package.use
    run: |
      curl https://mise.run | sh
      export PATH="$HOME/.local/share/mise/shims:$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
      mise trust mise.toml && MISE_YES=1 mise install
      echo "$HOME/.local/share/mise/shims:$HOME/.local/bin:$HOME/.cargo/bin" > "$RWX_ENV/PATH"
    filter:
      - mise.toml

  # One cached fetch shared by check and the three build legs.
  - key: deps
    use: tools
    run: |
      cargo fetch --locked
      (cd assets && npm ci --ignore-scripts --no-audit --no-fund)
    # cargo needs the target files to parse the manifest and mise needs its config; keep the
    # rest out of the cache key.
    filter:
      - mise.toml
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - src/lib.rs
      - src/main.rs
      - assets/package.json
      - assets/package-lock.json
