# Publishes GitHub releases with prebuilt binaries.
#
# Releases are calver with a per-day counter: `vYYYY.MM.DD.N` (N starts at 1), the same
# shape swamp uses for its model versions. Every release
# is a plain, immutable release; a second build on the same day gets the next N rather than
# replacing anything. Plain (non-prerelease) tags mean `mise use
# github:JacobHayes/briefing@latest` resolves them without --prerelease.
#
# - Daily cron -> a release at main HEAD, skipped when main has not moved since the last one.
# - `rwx run .rwx/release.yml` publishes from the CLI (use `--init
#   force=true` to publish even if main has not moved).
#
# Assets are named `briefing-<target>.tar.gz` (plus sha256 sums) so mise autodetects the
# right one.
#
# Cloning and listing releases need no token (public repo). Creating releases does, so
# `publish` uses BRIEFING_GITHUB_TOKEN from the RWX vault `briefing`: a fine-grained PAT with
# Contents: read/write on JacobHayes/briefing (`rwx vaults secrets set --vault briefing
# BRIEFING_GITHUB_TOKEN=...`). It is its own vault because the cron trigger has no user behind
# it and can only reach a vault whose access rules admit this repository.

on:
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      force: "false"
  cron:
    - key: daily
      schedule: '0 9 * * *' # 09:00 UTC daily
      init:
        commit-sha: ${{ event.git.sha }}
        force: "false"

concurrency-pools:
  - id: JacobHayes/briefing:release
    capacity: 1
    on-overflow: cancel-waiting

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: code
    call: git/clone 2.1.0
    with:
      repository: https://github.com/JacobHayes/briefing.git
      ref: ${{ init.commit-sha }}

  # Rust + mise tools and the dependency fetch (shared with ci.yml).
  - key: toolchain
    use: code
    call: ${{ run.dir }}/packages/toolchain.yml

  # Decide the tag for this run and whether anything needs publishing.
  - key: plan
    use: toolchain.tools
    cache: false
    env:
      FORCE: ${{ init.force }}
      SHA: ${{ init.commit-sha }}
    run: |
      set -euo pipefail
      sha="$SHA"
      day="$(date -u +%Y.%m.%d)"
      # Public repo: the releases list needs no token.
      releases="$(curl -fsSL -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/JacobHayes/briefing/releases?per_page=100' \
        | jq -r '.[] | select(.tag_name | test("^v[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}\\.[0-9]+$")) | [.tag_name, .target_commitish] | @tsv')"
      publish=true
      # Skip when the newest release already points at this commit.
      last="$(printf '%s\n' "$releases" | head -n1 | cut -f2)"
      if [ "$last" = "$sha" ] && [ "$FORCE" != "true" ]; then
        echo "main unchanged since the last release ($sha); nothing to publish"; publish=false
      fi
      # Next counter for today: one past the highest existing vYYYY.MM.DD.N.
      n="$(printf '%s\n' "$releases" | cut -f1 | { grep -E "^v${day//./\\.}\.[0-9]+$" || true; } | sed 's/.*\.//' | sort -n | tail -n1)"
      release_tag="v${day}.$(( ${n:-0} + 1 ))"
      echo "release_tag=$release_tag publish=$publish sha=$sha"
      echo "$release_tag" > "$RWX_VALUES/release-tag"
      echo "$publish" > "$RWX_VALUES/publish"
      echo "$sha" > "$RWX_VALUES/sha"

  # Export the tag for build.rs (`briefing --version`); see packages/build.yml.
  - key: version
    use: toolchain
    if: ${{ tasks.plan.values.publish == 'true' }}
    cache: false
    env:
      RELEASE_TAG: ${{ tasks.plan.values.release-tag }}
    run: echo "$RELEASE_TAG" > "$RWX_ENV/BRIEFING_VERSION"

  - key: build
    use: version
    call: ${{ run.dir }}/packages/build.yml

  - key: publish
    use: toolchain.tools
    after: [build]
    if: ${{ tasks.plan.values.publish == 'true' }}
    cache: false
    env:
      GH_TOKEN:
        value: ${{ vaults.briefing.secrets.BRIEFING_GITHUB_TOKEN }}
        cache-key: excluded
      RELEASE_TAG: ${{ tasks.plan.values.release-tag }}
      SHA: ${{ tasks.plan.values.sha }}
      ASSETS: ${{ tasks.build.tasks.build.artifacts.dist }}
    run: |
      set -euo pipefail
      sudo apt-get update && sudo apt-get install -y --no-install-recommends gh && sudo apt-get clean
      files="$(find "$ASSETS" -type f \( -name '*.tar.gz' -o -name '*.sha256' \))"
      if gh release view "$RELEASE_TAG" --repo JacobHayes/briefing >/dev/null 2>&1; then
        echo "$RELEASE_TAG already exists; releases are immutable, re-run to get the next counter" >&2
        exit 1
      fi
      gh release create "$RELEASE_TAG" --repo JacobHayes/briefing --target "$SHA" \
        --title "briefing $RELEASE_TAG" --notes "Build of main at $SHA." $files
      echo "published $RELEASE_TAG"
