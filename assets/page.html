    }

    function richTargetsMatch(left, right) {
      const a = normalizeTarget(left);
      const b = normalizeTarget(right);
      if (!a.contentType || !b.contentType || a.contentType !== b.contentType) return false;
      if (!a.targetType || !b.targetType || a.targetType !== b.targetType) return false;
      if (a.section && b.section && a.section !== b.section) return false;
      if (a.targetId && b.targetId) return a.targetId === b.targetId;
      if (a.targetLabel && b.targetLabel) return a.targetLabel === b.targetLabel;
      return false;
    }

    function annotationsForRichTarget(target) {
      return state.annotations.filter(a => a.target && richTargetsMatch(a.target, target));
    }

    function decorateRichTarget(node, target, { openNewWhenEmpty = true } = {}) {
      const anns = annotationsForRichTarget(target);
      if (anns.length) {
        node.setAttribute("data-anno-ids", anns.map(a => a.id).join(" "));
        node.classList.add("rich-has-comments");
      } else {
        node.removeAttribute("data-anno-ids");
        node.classList.remove("rich-has-comments");
      }
      const showExisting = pinned => {
        if (!anns.length) return false;
        showPopover(node, pinned);
        return true;
      };
      node.addEventListener("mouseenter", () => { if (!popover.pinned) showExisting(false); });
      node.addEventListener("mouseleave", () => { if (!popover.pinned) hidePopover(); });
      node.addEventListener("focus", () => { if (!popover.pinned) showExisting(false); });
      node.addEventListener("blur", () => { if (!popover.pinned) hidePopover(); });
      node.addEventListener("click", event => {
        event.preventDefault();
        event.stopPropagation();
        if (!showExisting(true) && openNewWhenEmpty) openRichComment(node, target);
      });
      node.addEventListener("keydown", event => {
        if (event.key !== "Enter" && event.key !== " ") return;
        event.preventDefault();
        event.stopPropagation();
        if (!showExisting(true) && openNewWhenEmpty) openRichComment(node, target);
      });
      return anns;
    }

    function richLocation(target) {
      const t = normalizeTarget(target);
      const pieces = [t.section || "Section"];
      if (t.contentType) pieces.push(t.contentType);
      if (t.targetType && t.targetLabel) pieces.push(t.targetType + ": " + t.targetLabel);
      else if (t.targetType) pieces.push(t.targetType);
      return pieces.join(" · ");
    }

    function makeRichBlock(sourceNode, contentType, title, targetType, source) {
      const target = normalizeTarget({
        section: sectionForNode(sourceNode),
        contentType,
        targetType,
        targetLabel: title,
        sourceExcerpt: sourceExcerpt(source),
      });
      const body = el("div", { class: "rich-body" });
      const comment = el("button", { class: "rich-comment", type: "button", text: "Comment" });
      const figure = el("figure", { class: "rich-block rich-" + contentType, "data-rich-type": contentType }, [
        el("div", { class: "rich-head" }, [
          el("div", { class: "rich-title", text: title }),
          el("div", { class: "rich-actions" }, comment),
        ]),
        body,
      ]);
      const saved = decorateRichTarget(comment, target);
      if (saved.length) {
        comment.textContent = "Comments (" + saved.length + ")";
        comment.classList.add("has-comments");
      }
      return { figure, body, target };
    }

    function attachMermaidTargets(svg, source, baseTarget) {
      if (!svg) return;
      const labels = mermaidLabelMap(source);
      const candidates = svg.querySelectorAll("g.node, g.edgePath, g.edgeLabel, .node, .edgeLabel");
      candidates.forEach((node, index) => {
        const classes = String(node.getAttribute("class") || "");
        const targetType = /edge/i.test(classes) ? "edge" : "node";
        const rawId = node.getAttribute("id") || targetType + "-" + index;
        const stableId = stableMermaidId(rawId);
        const semanticId = semanticMermaidId(stableId);
        const label = cleanTargetText(labels.get(semanticId) || node.textContent || semanticId || stableId).slice(0, 160);
        if (!label && !stableId) return;
        node.classList.add("rich-targetable");
        node.setAttribute("tabindex", "0");
        node.setAttribute("role", "button");
        node.setAttribute("aria-label", "Comment on Mermaid " + targetType + (label ? ": " + label : ""));
        const target = normalizeTarget({
          ...baseTarget,
          targetType,
          targetId: stableId,
          targetLabel: label || targetType,
          sourceExcerpt: sourceExcerpt(source),
        });
        decorateRichTarget(node, target);
      });
    }

    async function renderMermaidBlock(pre, source) {
      const block = makeRichBlock(pre, "mermaid", "Mermaid diagram", "diagram", source);
      pre.replaceWith(block.figure);
      if (!window.mermaid) {
        block.body.append(renderRichError("Mermaid renderer unavailable", "The local Mermaid library did not load.", source));
        return;
      }
      try {
        if (!mermaidInitialized) {
          window.mermaid.initialize({
            startOnLoad: false,
            securityLevel: "strict",
            theme: window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "default",
            htmlLabels: false,
            flowchart: { htmlLabels: false },
          });
          mermaidInitialized = true;
        }
        const id = "briefing-mermaid-" + (++richCounter);
        const rendered = await window.mermaid.render(id, source);
        block.body.innerHTML = sanitizeSvg(rendered.svg);
        if (rendered.bindFunctions) rendered.bindFunctions(block.body);
        attachMermaidTargets(block.body.querySelector("svg"), source, block.target);
      } catch (error) {
        block.body.replaceChildren(renderRichError("Mermaid render failed", errorMessage(error), source));
      }
    }

    async function renderVegaLiteBlock(pre, source) {
      const block = makeRichBlock(pre, "vega-lite", "Vega-Lite chart", "chart", source);
      pre.replaceWith(block.figure);
      const embed = window.vegaEmbed;
      if (!embed) {
        block.body.append(renderRichError("Vega-Lite renderer unavailable", "The local Vega/Vega-Lite libraries did not load.", source));
        return;
      }
      let spec;
      try {
        spec = JSON.parse(source);
      } catch (error) {
        block.body.append(renderRichError("Vega-Lite JSON parse failed", errorMessage(error), source));
        return;
      }
      try {
        const renderSpec = spec && typeof spec === "object" && !Array.isArray(spec) ? { ...spec } : spec;
        if (renderSpec && renderSpec.width === undefined) {
          renderSpec.width = "container";
          if (renderSpec.autosize === undefined) renderSpec.autosize = { type: "fit", contains: "padding", resize: true };
        }
        await embed(block.body, renderSpec, { actions: false, renderer: "svg", tooltip: true });
      } catch (error) {
        block.body.replaceChildren(renderRichError("Vega-Lite render failed", errorMessage(error), source));
      }
    }

    function enhanceCodeBlocks(root) {
      root.querySelectorAll("pre > code").forEach(code => {
        const pre = code.parentElement;
        const language = languageOf(code);
        const source = code.textContent || "";
        if (isMermaidLanguage(language)) {
          void renderMermaidBlock(pre, source);
          return;
        }
        if (isVegaLiteLanguage(language)) {
          void renderVegaLiteBlock(pre, source);
          return;
        }
        if (window.hljs) {
          try {
            if (language && window.hljs.getLanguage && window.hljs.getLanguage(language)) code.innerHTML = window.hljs.highlight(source, { language, ignoreIllegals: true }).value;
            else code.innerHTML = window.hljs.highlightAuto(source).value;
            code.classList.add("hljs");
          } catch {
            code.textContent = source;
          }
        }
      });
    }

    function cleanupExternalRenderArtifacts() {
      document.querySelectorAll("#vg-tooltip-element, .vg-tooltip, .vega-tooltip").forEach(node => node.remove());
    }

    function renderMarkdownInto(root, value, inlineOnly = false) {
      try {
        const renderer = makeMarkdownRenderer();
        const api = markdownApi();
        const source = String(value || "");
        const html = inlineOnly ? api.parseInline(source, { gfm: true, breaks: false, renderer }) : api.parse(source, { gfm: true, breaks: false, renderer });
        const clean = sanitizeHtml(html);
        root.replaceChildren(fragmentFromHtml(clean));
        scopeSanitizedClasses(root);
        normalizeSanitizedLinks(root);
        if (!inlineOnly) enhanceCodeBlocks(root);
        if (!root.childNodes.length) root.append(document.createTextNode(""));
      } catch (error) {
        root.replaceChildren(renderRichError("Markdown render failed", errorMessage(error), value));
      }
    }

    function inlineMarkdown(value) {
      const root = el("span", {});
      renderMarkdownInto(root, value, true);
      return [...root.childNodes];
    }

    function mdInline(tag, attrs, value) {
      return el(tag, attrs, inlineMarkdown(value));
    }

    function markdownBlock(className, value) {
      const root = el("div", { class: className ? className + " markdown" : "markdown" });
      renderMarkdownInto(root, value, false);
      return root;
    }

    const list = (items, className) => el("ul", { class: className }, items.map(item => mdInline("li", {}, item)));
    // --- Draft persistence: the server holds the draft (so another device or a restarted
    // agent process can pick it up); localStorage is a write-through cache for flaky links.
    const storageKey = () => "briefing:" + presentation.id;
    let draftRevision = 0;
    let syncTimer = null;
    let syncing = false;
    let syncQueued = false;
    let toastTimer = null;
    const snapshot = () => ({ current, state, disclosures: disclosureState, updatedAt: Date.now() });
    const cacheLocally = draft => { try { localStorage.setItem(storageKey(), JSON.stringify(draft)); } catch { /* storage unavailable */ } };
    // Debounced: a typing burst costs one snapshot, not one per keystroke.
    const save = () => {
      clearTimeout(syncTimer);
      syncTimer = setTimeout(() => { void syncDraft(); }, 500);
    };
    function toast(message) {
      let node = document.getElementById("toast");
      if (!node) { node = el("div", { id: "toast", class: "toast", role: "status" }); document.body.append(node); }
      node.textContent = message;
      node.classList.add("visible");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => node.classList.remove("visible"), 3500);
    }
    function applyDraft(saved) {
      if (saved && Number.isInteger(saved.current) && saved.state) {
        current = Math.max(0, Math.min(saved.current, screens.length));
        state = saved.state;
        disclosureState = saved.disclosures;
      }
      if (!state || typeof state !== "object") state = { chunks: {}, decisions: {}, annotations: [], notes: [], overallNote: "" };
      if (!state.chunks) state.chunks = {};
      if (!state.decisions) state.decisions = {};
      if (!Array.isArray(state.annotations)) state.annotations = [];
      if (!Array.isArray(state.notes)) state.notes = [];
      state.notes = state.notes.filter(n => n && typeof n.text === "string").map(n => ({ id: n.id || uid(), text: n.text }));
      if (!disclosureState || typeof disclosureState !== "object" || Array.isArray(disclosureState)) disclosureState = {};
    }
    function adoptServerDraft(draft, revision, message) {
      draftRevision = revision;
      applyDraft(draft);
      cacheLocally(snapshot());
      if (message) toast(message);
      if (!submitted) render();
    }
    async function syncDraft(flush = false) {
      if (submitted) return;
      if (syncing) { syncQueued = true; return; }
      syncing = true;
      clearTimeout(syncTimer);
      syncTimer = null;
      cacheLocally(snapshot());
      try {
        const response = await fetch("/api/" + presentation.token + "/draft", {
          method: "PUT", headers: { "content-type": "application/json" }, keepalive: flush,
          body: JSON.stringify({ baseRevision: draftRevision, draft: snapshot() }),
        });
        if (response.status === 409) {
          const body = await response.json();
          if (body.draft) adoptServerDraft(body.draft, body.revision, "Loaded a newer draft from another device");
        } else if (response.ok) {
          draftRevision = (await response.json()).revision;
        }
      } catch { /* Offline: the local copy stands and is retried on the next change or focus. */ }
      finally {
        syncing = false;
        if (syncQueued) { syncQueued = false; save(); }
      }
    }
    let refreshing = false;
    async function refreshFromServer() {
      if (submitted || refreshing) return;
      refreshing = true;
      try {
        const response = await fetch("/api/" + presentation.token + "/presentation", { cache: "no-store" });
        if (!response.ok) return;
        const latest = await response.json();
        if (latest.status !== "active") { submitted = true; renderDone(latest.status === "cancelled"); return; }
        if ((latest.draftRevision || 0) > draftRevision && latest.draft) adoptServerDraft(latest.draft, latest.draftRevision, "Loaded a newer draft from another device");
        else if (syncQueued || syncTimer) void syncDraft();
      } catch { /* Server unreachable; keep the local draft. */ }
      finally { refreshing = false; }
    }
    const restore = () => {
      let local = null;
      try { local = JSON.parse(localStorage.getItem(storageKey()) || "null"); } catch { /* Ignore corrupt browser-local draft state. */ }
      const server = presentation.draft && typeof presentation.draft === "object" ? presentation.draft : null;
      draftRevision = presentation.draftRevision || 0;
      const useServer = server && (!local || (server.updatedAt || 0) >= (local.updatedAt || 0));
      applyDraft(useServer ? server : local);
      if (!useServer && local) save();
    };
    document.addEventListener("visibilitychange", () => { if (document.hidden) void syncDraft(true); else void refreshFromServer(); });
    window.addEventListener("focus", () => { void refreshFromServer(); });
    window.addEventListener("pagehide", () => { if (syncTimer) void syncDraft(true); });
    const chunkState = index => state.chunks[index] ||= { note: "", checkpoint: "", status: "" };
    // Decision drafts are keyed by "<index>" for top-level decisions and "chunk:<index>" for inline ones.
    const decisionState = key => state.decisions[key] ||= { selected: "", note: "" };
    // Every decision in reading order: inline ones with their chunk, then the top-level ones.
    function allDecisions() {
      const inline = presentation.chunks.flatMap((chunk, index) => chunk.decision ? [{ decision: chunk.decision, key: "chunk:" + index, section: chunk.title }] : []);
      const standalone = presentation.decisions.map((decision, index) => ({ decision, key: index, section: null }));
      return [...inline, ...standalone];
    }
    function screenDecision(screen) {
      if (!screen) return null;
      if (screen.type === "decision") return { decision: screen.data, key: screen.index };
      if (screen.data.decision) return { decision: screen.data.decision, key: "chunk:" + screen.index };
      return null;
    }
    const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
    const hasOwn = (object, key) => Object.prototype.hasOwnProperty.call(object, key);

    function bindDisclosure(node, key) {
      node.dataset.disclosureKey = key;
      if (hasOwn(disclosureState, key)) node.open = Boolean(disclosureState[key]);
      node.addEventListener("toggle", () => {
        disclosureState[key] = node.open;
        save();
      });
      return node;
    }

    function captureDisclosureState() {
      document.querySelectorAll("#app details[data-disclosure-key]").forEach(detail => {
        const key = detail.getAttribute("data-disclosure-key");
        if (key) disclosureState[key] = detail.open;
      });
    }

    // --- Inline annotations (text selection is always active in annotatable regions) ---
    const commentButton = el("button", { class: "comment-fab", type: "button", "aria-label": "Comment on the selected text (shortcut: c)", title: "Comment (c)", text: "Comment" });
    commentButton.hidden = true;
    commentButton.addEventListener("pointerdown", event => {
      event.preventDefault();
      event.stopPropagation();
      openComposer();
    });
    commentButton.addEventListener("click", event => {
      event.preventDefault();
      openComposer();
    });
    document.body.append(commentButton);

    // Shared saved-comment popover. Hover or keyboard focus shows a quiet
    // read-only preview; clicking a highlight (or pressing Enter/Space on it)
    // pins the popover and reveals an Edit action. The pinned state survives
    // moving the pointer from the highlight onto its Edit button.
    const tooltip = el("div", { class: "anno-tip", role: "tooltip" });
    tooltip.hidden = true;
    document.body.append(tooltip);
    const popover = { mark: null, pinned: false };

    function hidePopover() {
      tooltip.hidden = true;
      tooltip.replaceChildren();
      tooltip.classList.remove("pinned");
      popover.mark = null;
      popover.pinned = false;
    }

    function annotationsForMark(mark) {
      const ids = (mark.getAttribute("data-anno-ids") || "").split(/\s+/).filter(Boolean);
      return ids.map(id => state.annotations.find(a => a.id === id)).filter(Boolean);
    }

    function showPopover(mark, pinned) {
      const anns = annotationsForMark(mark);
      if (!anns.length) return;
      popover.mark = mark;
      popover.pinned = pinned;
      tooltip.classList.toggle("pinned", pinned);
      tooltip.setAttribute("role", pinned ? "dialog" : "tooltip");
      tooltip.setAttribute("aria-label", pinned ? "Saved comments" : "Saved comment preview");
      tooltip.replaceChildren(...anns.map(a => {
        const item = el("div", { class: "anno-tip-item" }, [
          el("div", { class: "anno-tip-loc", text: a.location }),
          markdownBlock("anno-tip-comment", a.comment),
        ]);
        if (pinned) item.append(el("div", { class: "anno-tip-actions" }, [
          el("button", { class: "anno-tip-edit", type: "button", text: "Edit", onclick: () => openEditComposer(a.id, mark.getBoundingClientRect()) }),
          el("button", { class: "anno-tip-delete", type: "button", text: "Delete", onclick: event => requestDeleteAnnotation(a.id, event.currentTarget) }),
        ]));
        return item;
      }));
      tooltip.hidden = false;
      positionSavedPopover(tooltip, mark.getBoundingClientRect());
    }

    // Pin the popover so it stays open and exposes Edit. focusEdit lands keyboard
    // focus on the Edit button so keyboard users can reach it (and Escape back).
    function pinPopover(mark, focusEdit) {
      hideCommentButton();
      showPopover(mark, true);
      if (focusEdit) tooltip.querySelector(".anno-tip-edit")?.focus();
    }

    // Linearize a region's visible text into one string plus a map back to the
    // text nodes that produced it, so annotations can be anchored by text offset
    // rather than by a serialized live DOM Range.
    function linearize(region) {
      const walker = document.createTreeWalker(region, NodeFilter.SHOW_TEXT);
      const nodes = [];
      let text = "";
      let node;
      while ((node = walker.nextNode())) {
        const value = node.nodeValue || "";
        nodes.push({ node, start: text.length, length: value.length });
        text += value;
      }
      return { text, nodes };
    }

    // Offset, in the region's linear text, of a Range boundary. Uses a measuring
    // Range so element-boundary selections resolve as well as text-node ones.
    function linearStart(region, range) {
      const measure = document.createRange();
      measure.setStart(region, 0);
      measure.setEnd(range.startContainer, range.startOffset);
      return measure.toString().length;
    }

    function occurrences(haystack, needle) {
      const out = [];
      if (!needle) return out;
      let from = 0;
      for (;;) {
        const at = haystack.indexOf(needle, from);
        if (at < 0) break;
        out.push(at);
        from = at + 1;
      }
      return out;
    }

    // Resolve an annotation to a [start, end) interval in the region's current
    // text using its exact quote, expected offset, and prefix/suffix context.
    // Returns null when the quote is absent so the passage is never highlighted
    // on the wrong text; the annotation still appears in the final review.
    function resolveInterval(text, ann) {
      const quote = ann.anchorQuote || ann.quote || "";
      const positions = occurrences(text, quote);
      if (!positions.length) return null;
      const prefix = ann.prefix || "";
      const suffix = ann.suffix || "";
      const expected = Number.isInteger(ann.start) ? ann.start : 0;
      let best = -1;
      let bestScore = -Infinity;
      for (const at of positions) {
        let context = 0;
        for (let i = 1; i <= prefix.length; i++) {
          if (text[at - i] === prefix[prefix.length - i]) context++; else break;
        }
        for (let i = 0; i < suffix.length; i++) {
          if (text[at + quote.length + i] === suffix[i]) context++; else break;
        }
        const score = context * 1000 - Math.abs(at - expected);
        if (score > bestScore) { bestScore = score; best = at; }
      }
      return best < 0 ? null : { start: best, end: best + quote.length };
    }

    // Rebuild highlight <mark>s inside a freshly rendered region. Runs against a
    // clean DOM every render, so repeated renders never corrupt offsets, and
    // overlapping annotations merge into shared segments.
    function highlightRegion(region) {
      const location = region.getAttribute("data-section");
      const anns = state.annotations.filter(a => (a.location || "") === location);
      if (!anns.length) return;
      const { text, nodes } = linearize(region);
      const intervals = [];
      for (const ann of anns) {
        const found = resolveInterval(text, ann);
        if (found) intervals.push({ start: found.start, end: found.end, id: ann.id });
      }
      if (!intervals.length) return;
      // Merge into non-overlapping segments, each carrying every covering id.
      const bounds = new Set();
      for (const iv of intervals) { bounds.add(iv.start); bounds.add(iv.end); }
      const points = [...bounds].sort((a, b) => a - b);
      const segments = [];
      for (let i = 0; i < points.length - 1; i++) {
        const s = points[i], e = points[i + 1];
        const ids = intervals.filter(iv => iv.start <= s && iv.end >= e).map(iv => iv.id);
        if (ids.length) segments.push({ start: s, end: e, ids });
      }
      if (!segments.length) return;
      // Wrap each text node's covered parts (the DOM is untouched since linearize ran).
      for (const entry of nodes) {
        const ns = entry.start;
        const ne = ns + entry.length;
        const covering = segments.filter(seg => seg.start < ne && seg.end > ns);
        if (!covering.length) continue;
        const value = entry.node.nodeValue || "";
        const frag = document.createDocumentFragment();
        let cursor = ns;
        for (const seg of covering) {
          const s = Math.max(seg.start, ns);
          const e = Math.min(seg.end, ne);
          if (s > cursor) frag.append(document.createTextNode(value.slice(cursor - ns, s - ns)));
          const mark = el("mark", { class: "anno-mark", tabindex: "0", "data-anno-ids": seg.ids.join(" ") }, value.slice(s - ns, e - ns));
          const ids = seg.ids.map(id => state.annotations.find(a => a.id === id)).filter(Boolean);
          mark.setAttribute("aria-label", ids.map(a => "Comment: " + a.comment).join("; "));
          mark.addEventListener("mouseenter", () => { if (!popover.pinned) showPopover(mark, false); });
          mark.addEventListener("mouseleave", () => { if (!popover.pinned) hidePopover(); });
          mark.addEventListener("focus", () => { if (!popover.pinned) showPopover(mark, false); });
          mark.addEventListener("blur", () => { if (!popover.pinned) hidePopover(); });
          mark.addEventListener("click", () => {
            const sel = window.getSelection();
            // A real text selection outranks viewing; let the Comment action win.
            if (sel && !sel.isCollapsed && sel.toString().trim()) return;
            pinPopover(mark, false);
          });
          mark.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") { event.preventDefault(); pinPopover(mark, true); }
          });
          frag.append(mark);
          cursor = e;
        }
        if (cursor < ne) frag.append(document.createTextNode(value.slice(cursor - ns)));
        entry.node.parentNode.replaceChild(frag, entry.node);
      }
    }

    function decorateHighlights() {
      hidePopover();
      if (!state.annotations.length) return;
      document.querySelectorAll("#app [data-section]").forEach(highlightRegion);
    }

    // Viewport-bounded placement below the anchor, flipping above when it would
    // overflow. Used directly for the mobile saved-comment fallback.
    // The part of the layout viewport that is actually on screen: iOS shrinks and offsets it
    // while the on-screen keyboard is up, and fixed elements are placed in layout coordinates.
    function visibleRect() {
      const vv = window.visualViewport;
      return vv
        ? { top: vv.offsetTop, left: vv.offsetLeft, width: vv.width, height: vv.height }
        : { top: 0, left: 0, width: window.innerWidth, height: window.innerHeight };
    }

    function clampBelowAbove(node, rect) {
      const margin = 8;
      const view = visibleRect();
      node.style.maxHeight = (view.height - 2 * margin) + "px";
      const w = node.offsetWidth;
      const h = node.offsetHeight;
      const left = Math.max(view.left + margin, Math.min(rect.left, view.left + view.width - w - margin));
      let top = rect.bottom + margin;
      if (top + h > view.top + view.height - margin) top = rect.top - h - margin;
      top = Math.max(view.top + margin, Math.min(top, view.top + view.height - h - margin));
      node.style.left = left + "px";
      node.style.top = top + "px";
    }

    // Selection-relative overlays (the Comment action and the composer) stay
    // anchored below/above the selection or its highlight.
    function positionOverlay(node, rect) {
      node.style.left = "0px";
      node.style.top = "0px";
      requestAnimationFrame(() => clampBelowAbove(node, rect));
    }

    // Touch browsers draw their own selection callout (Copy / Look Up / ...)
    // right where clampBelowAbove would put the Comment action. iOS 26 Safari
    // puts it above or below the selection depending on room, and the rule is
    // not simply "upper half goes below" (seen below at 49% of the height), so
    // on touch the action always sits TOUCH_CALLOUT_CLEARANCE under the
    // selection: clear of a callout below it, and a callout above never
    // reaches there. Never above, where the start handle lives. Mouse
    // selection keeps the tight below/above placement.
    const coarsePointer = window.matchMedia("(pointer: coarse)");
    function positionCommentButton(rect) {
      if (!coarsePointer.matches) { positionOverlay(commentButton, rect); return; }
      commentButton.style.left = "0px";
      commentButton.style.top = "0px";
      requestAnimationFrame(() => {
        const margin = 8;
        const view = visibleRect();
        const w = commentButton.offsetWidth;
        const h = commentButton.offsetHeight;
        let top = rect.bottom + margin + TOUCH_CALLOUT_CLEARANCE;
        if (top + h > view.top + view.height - margin) top = rect.bottom + margin;
        top = Math.max(view.top + margin, Math.min(top, view.top + view.height - h - margin));
        commentButton.style.left = Math.max(view.left + margin, Math.min(rect.left, view.left + view.width - w - margin)) + "px";
        commentButton.style.top = top + "px";
      });
    }

    // Saved comments become true book-like margin notes when the viewport can
    // hold the content column, gap, and a useful rail. The note is anchored to
    // the column edge rather than the selected words, so it never covers reading
    // text. Narrower screens retain the bounded below/above fallback.
    function positionSavedPopover(node, rect) {
      const margin = 8;
      node.style.left = "0px";
      node.style.top = "0px";
      node.style.width = "";
      node.style.maxWidth = "";
      node.dataset.placement = "overlay";
      requestAnimationFrame(() => {
        const column = document.querySelector("main");
        const columnRect = column?.getBoundingClientRect();
        if (columnRect) {
          const left = columnRect.right + MARGIN_RAIL_GAP;
          const available = window.innerWidth - margin - left;
          if (available >= MARGIN_RAIL_MIN_USABLE) {
            const width = Math.min(MARGIN_RAIL_WIDTH, available);
            node.style.width = width + "px";
            node.style.maxWidth = width + "px";
            const h = node.offsetHeight;
            const top = Math.max(margin, Math.min(rect.top, window.innerHeight - h - margin));
            node.style.left = left + "px";
            node.style.top = top + "px";
            node.dataset.placement = "margin";
            return;
          }
        }
        clampBelowAbove(node, rect);
      });
    }

    function hideCommentButton() { commentButton.hidden = true; }

    function selectionAnchorRect(range) {
      const rects = [...range.getClientRects()].filter(rect => rect.width > 0 || rect.height > 0);
      if (rects.length) return rects[rects.length - 1];
      const rect = range.getBoundingClientRect();
      return rect && (rect.width > 0 || rect.height > 0) ? rect : null;
    }

    // A paragraph selection ends outside the reading region on the browser's
    // trailing newline, which would push the range's common ancestor past the
    // region. Return a copy narrowed to the selected non-whitespace text, or
    // null when only whitespace is selected. Real content outside the region
    // still widens the range, so cross-region selections stay unannotatable.
    function trimRangeToText(range) {
      const walker = document.createTreeWalker(range.commonAncestorContainer, NodeFilter.SHOW_TEXT);
      walker.currentNode = range.startContainer;
      let first = null;
      let last = null;
      let started = false;
      // Text nodes arrive in document order from the range's start, so the first
      // one that no longer intersects is past its end.
      let text = range.startContainer.nodeType === 3 ? range.startContainer : walker.nextNode();
      for (; text; text = walker.nextNode()) {
        if (!range.intersectsNode(text)) { if (started) break; continue; }
        started = true;
        const from = text === range.startContainer ? range.startOffset : 0;
        const to = text === range.endContainer ? range.endOffset : text.length;
        const selected = text.data.slice(from, to);
        const trimmed = selected.trim();
        if (!trimmed) continue;
        const lead = from + selected.length - selected.trimStart().length;
        first ||= { node: text, offset: lead };
        last = { node: text, offset: lead + trimmed.length };
      }
      if (!first) return null;
      const trimmedRange = range.cloneRange();
      trimmedRange.setStart(first.node, first.offset);
      trimmedRange.setEnd(last.node, last.offset);
      return trimmedRange;
    }

    function annotatableRegion(range) {
      const node = range.commonAncestorContainer;
      const elt = node.nodeType === 1 ? node : node.parentElement;
      if (!elt) return null;
      const region = elt.closest("[data-section]");
      if (!region) return null;
      // Never annotate form controls even if a future region were to contain one.
      const start = range.startContainer.nodeType === 1 ? range.startContainer : range.startContainer.parentElement;
      if (start && start.closest("input, textarea, select, button")) return null;
      return region;
    }

    function evaluateSelection() {
      if (submitted || composer) { hideCommentButton(); return; }
      const sel = window.getSelection();
      if (!sel || sel.isCollapsed || !sel.rangeCount) { hideCommentButton(); return; }
      const range = trimRangeToText(sel.getRangeAt(0));
      if (!range) { hideCommentButton(); return; }
      const region = annotatableRegion(range);
      if (!region) { hideCommentButton(); return; }
      const quote = sel.toString().trim();
      // Both boundaries sit on non-whitespace, so the anchor needs no correction.
      const anchorQuote = range.toString();
      if (!quote) { hideCommentButton(); return; }
      const { text } = linearize(region);
      const start = linearStart(region, range);
      const clipped = quote.slice(0, MAX_QUOTE);
      const clippedAnchor = anchorQuote.slice(0, MAX_QUOTE);
      const end = start + clippedAnchor.length;
      const location = region.getAttribute("data-section") || "Section";
      const rect = selectionAnchorRect(range);
      if (!rect) { hideCommentButton(); return; }
      pendingSelection = {
        location,
        quote: clipped,
        anchorQuote: clippedAnchor,
        start,
        prefix: text.slice(Math.max(0, start - ANCHOR_CONTEXT), start),
        suffix: text.slice(end, end + ANCHOR_CONTEXT),
        rect,
      };
      // A real text selection — even one overlapping an existing highlight —
      // outranks the saved-comment popover: unpin/hide it before the Comment
      // action so it can never sit above the add-comment affordance.
      hidePopover();
      commentButton.hidden = false;
      positionCommentButton(rect);
    }

    function addAnnotation(sel, comment) {
      if (state.annotations.length >= MAX_ANNOTATIONS) return null;
      const target = sel.target ? normalizeTarget(sel.target) : null;
      const ann = {
        id: uid(),
        location: String(sel.location).slice(0, 300),
        quote: String(sel.quote).slice(0, MAX_QUOTE),
        anchorQuote: String(sel.anchorQuote || sel.quote).slice(0, MAX_QUOTE),
        comment: String(comment).slice(0, MAX_COMMENT),
        start: sel.start,
        prefix: sel.prefix,
        suffix: sel.suffix,
        ...(target && Object.keys(target).length ? { target } : {}),
      };
      state.annotations.push(ann);
      save();
      return ann;
    }

    function openRichComment(anchor, target) {
      if (composer || submitted) return;
      hidePopover();
      hideCommentButton();
      const normalized = normalizeTarget(target);
      const location = richLocation(normalized);
      const quote = (normalized.targetLabel || normalized.targetType || normalized.contentType || "Rendered content").slice(0, MAX_QUOTE);
      const rect = anchor.getBoundingClientRect();
      buildComposer({
        title: "Add a comment",
        location,
        excerpt: quote,
        initial: "",
        saveLabel: "Save comment",
        rect,
        onSave: comment => {
          const ann = addAnnotation({
            location,
            quote,
            anchorQuote: quote,
            start: 0,
            prefix: "",
            suffix: "",
            target: normalized,
          }, comment);
          if (!ann) return "Comment limit reached.";
          closeComposer(true);
        },
      });
    }

    function deleteAnnotation(id) {
      state.annotations = state.annotations.filter(a => a.id !== id);
      save();
      render();
    }

    function disarmDeleteButton(button) {
      button.dataset.deleteArmed = "false";
      button.classList.remove("armed");
      button.textContent = "Delete";
      button.setAttribute("aria-label", "Delete " + (button.dataset.deleteWhat || "comment"));
    }

    // Two-step in-page confirm: the first press arms the button, the second runs `action`.
    function requestDelete(button, what, action) {
      if (button.dataset.deleteArmed === "true") {
        action();
        return;
      }
      document.querySelectorAll('[data-delete-armed="true"]').forEach(disarmDeleteButton);
      button.dataset.deleteWhat = what;
      button.dataset.deleteArmed = "true";
      button.classList.add("armed");
      button.textContent = "Confirm delete?";
      button.setAttribute("aria-label", "Confirm delete " + what + "?");
      window.setTimeout(() => {
        if (button.isConnected && button.dataset.deleteArmed === "true") disarmDeleteButton(button);
      }, DELETE_ARM_MS);
    }

    function requestDeleteAnnotation(id, button) {
      requestDelete(button, "comment", () => { hidePopover(); deleteAnnotation(id); });
    }

    function closeComposer(rerender, restoreFocus = false) {
      if (composer) { composer.remove(); composer = null; }
      if (restoreFocus && composerReturnFocus) pendingFocus = composerReturnFocus;
      composerReturnFocus = null;
      pendingSelection = null;
      const sel = window.getSelection();
      if (sel && sel.removeAllRanges) sel.removeAllRanges();
      hideCommentButton();
      if (rerender) render();
    }

    // Shared focused composer for both adding a new comment and editing a saved
    // one. onSave returns an error string to keep the composer open, or nothing
    // once it has persisted and closed.
    function buildComposer(opts) {
      if (composer) { composer.remove(); composer = null; }
      composerReturnFocus = opts.returnFocus || null;
      const field = el("textarea", { class: "composer-input", "aria-label": opts.title, placeholder: "Add a comment about this passage" });
      field.value = opts.initial || "";
      const err = el("div", { class: "composer-err", role: "alert" });
      const setErr = message => { err.textContent = message; err.classList.add("visible"); };
      const saveBtn = el("button", { class: "btn primary", type: "button", text: opts.saveLabel });
      const cancelBtn = el("button", { class: "btn", type: "button", text: "Cancel" });
      saveBtn.addEventListener("click", () => {
        const comment = field.value.trim();
        if (!comment) { setErr("Enter a comment or cancel."); field.focus(); return; }
        const problem = opts.onSave(comment);
        if (problem) setErr(problem);
      });
      saveBtn.setAttribute("title", "Save (Command+Enter or Control+Enter)");
      field.addEventListener("keydown", event => {
        if (!event.isComposing && event.key === "Enter" && (event.metaKey || event.ctrlKey)) {
          event.preventDefault();
          saveBtn.click();
        }
      });
      cancelBtn.addEventListener("click", () => closeComposer(true, true));
      const excerpt = opts.excerpt.length > 240 ? opts.excerpt.slice(0, 240) + "…" : opts.excerpt;
      composer = el("div", { class: "composer", role: "dialog", "aria-modal": "false", "aria-label": opts.title }, [
        el("div", { class: "composer-loc", text: opts.location }),
        el("blockquote", { class: "composer-excerpt", text: excerpt }),
        field, err,
        el("div", { class: "composer-actions" }, [cancelBtn, saveBtn]),
      ]);
      document.body.append(composer);
      composerRect = opts.rect;
      hideCommentButton();
      positionOverlay(composer, opts.rect);
      field.focus();
      field.setSelectionRange(field.value.length, field.value.length);
    }

    function openComposer() {
      if (composer || !pendingSelection) return;
      const sel = pendingSelection;
      buildComposer({
        title: "Add a comment",
        location: sel.location,
        excerpt: sel.quote,
        initial: "",
        saveLabel: "Save comment",
        rect: sel.rect,
        onSave: comment => {
          const ann = addAnnotation(sel, comment);
          if (!ann) return "Comment limit reached.";
          // Land focus on the new highlight so keyboard users get the preview.
          pendingFocus = '[data-anno-ids~="' + ann.id + '"]';
          closeComposer(true);
        },
      });
    }

    function targetAllowsCommentShortcut(target) {
      const element = target instanceof Element ? target : target?.parentElement;
      if (!element) return true;
      return !element.closest("input, textarea, select, button, [contenteditable]");
    }

    function isPlainKey(event, key) {
      return event.key.toLowerCase() === key && !event.isComposing && !event.metaKey && !event.ctrlKey && !event.altKey && !event.shiftKey;
    }

    function isCommentShortcut(event) {
      return isPlainKey(event, "c");
    }

    function openNotesFromShortcut(event) {
      if (!isPlainKey(event, "n") || submitted || composer || !targetAllowsCommentShortcut(event.target)) return false;
      event.preventDefault();
      toggleNotes(true);
      return true;
    }

    function openComposerFromShortcut(event) {
      if (!isCommentShortcut(event) || submitted || composer || !targetAllowsCommentShortcut(event.target)) return false;
      evaluateSelection();
      if (commentButton.hidden || !pendingSelection) return false;
      event.preventDefault();
      event.stopPropagation();
      openComposer();
      return true;
    }

    // Edit a saved comment in place. Persists immediately; re-render rebuilds all
    // overlapping highlight segments and their tooltips from the updated comment.
    function openEditComposer(id, rect) {
      const ann = state.annotations.find(a => a.id === id);
      if (!ann) return;
      hidePopover();
      buildComposer({
        title: "Edit comment",
        location: ann.location,
        excerpt: ann.quote,
        initial: ann.comment,
        saveLabel: "Save changes",
        rect,
        returnFocus: '[data-anno-ids~="' + id + '"]',
        onSave: comment => {
          ann.comment = String(comment).slice(0, MAX_COMMENT);
          save();
          pendingFocus = '[data-anno-ids~="' + id + '"]';
          closeComposer(true);
        },
      });
    }

    let selectionEvaluateTimer = 0;
    function scheduleEvaluateSelection(delay = 0) {
      clearTimeout(selectionEvaluateTimer);
      selectionEvaluateTimer = setTimeout(evaluateSelection, delay);
    }

    document.addEventListener("selectionchange", () => scheduleEvaluateSelection(80));
    document.addEventListener("pointerup", () => scheduleEvaluateSelection(40));
    document.addEventListener("keyup", event => { if (event.shiftKey || event.key.indexOf("Arrow") === 0) scheduleEvaluateSelection(0); });
    function handleSelectionPointerStart(event) {
      if (event.target === commentButton) return;
      if (composer && composer.contains(event.target)) return;
      hideCommentButton();
      // Keep a pinned popover open while clicking inside it (its Edit button) or
      // on a highlight; unpin only when clicking elsewhere.
      if (popover.pinned && !tooltip.contains(event.target) && !(event.target.closest && event.target.closest(".anno-mark"))) hidePopover();
    }
    document.addEventListener("pointerdown", handleSelectionPointerStart);
    document.addEventListener("keydown", event => {
      if (openComposerFromShortcut(event)) return;
      if (openNotesFromShortcut(event)) return;
      if (event.key !== "Escape") return;
      if (composer) { closeComposer(true, true); event.preventDefault(); return; }
      const notes = document.getElementById("notes-panel");
      if (notes && notes.contains(event.target)) { toggleNotes(false); event.preventDefault(); return; }
      if (!tooltip.hidden) {
        const returnTo = popover.pinned ? popover.mark : null;
        hidePopover();
        returnTo?.focus();
        event.preventDefault();
        return;
      }
      if (!commentButton.hidden) { hideCommentButton(); return; }
    });
    const hasContext = () => {
      const t = presentation.tray || {};
      return Boolean((t.keyContext && t.keyContext.length) || t.runningSummary || (t.openQuestions && t.openQuestions.length));
    };

    function header() {
      const total = screens.length;
      const isReview = current >= total;
      const stepNow = isReview ? total : current + 1;
      const percent = total ? Math.round((stepNow / total) * 100) : 0;

      const actions = el("div", { class: "header-actions" });
      if (hasContext()) {
        actions.append(el("button", {
          class: "ghost", "aria-expanded": String(contextOpen), "aria-controls": "context-panel",
          text: contextOpen ? "Hide context" : "Context",
          onclick: () => { contextOpen = !contextOpen; render(); },
        }));
      }
      actions.append(el("button", {
        id: "notes-toggle", class: "ghost", "aria-expanded": String(notesOpen), "aria-controls": "notes-panel",
        text: notesButtonText(), onclick: () => toggleNotes(),
      }));
      actions.append(el("button", { class: "ghost", text: overview ? "Paced view" : "View all", onclick: () => { overview = !overview; render(); } }));

      const inner = el("div", { class: "header-inner" }, [
        el("div", { class: "header-row" }, [
          el("div", { class: "wordmark" }, [el("span", { class: "mark", text: "◆" }), el("span", { text: "Briefing" })]),
          actions,
        ]),
        overview ? null : el("div", { class: "progress-line" }, [
          el("div", { class: "progress", role: "progressbar", "aria-valuemin": 0, "aria-valuemax": total, "aria-valuenow": stepNow, "aria-label": "Progress through briefing" },
            (() => { const f = el("div", { class: "progress-fill" }); f.style.width = percent + "%"; return f; })()),
          el("span", { class: "progress-step", text: isReview ? "Review" : "Step " + stepNow + " of " + total }),
        ]),
      ]);

      const wrap = el("div", {}, el("div", { class: "header" }, inner));
      if (contextOpen && hasContext()) wrap.append(contextPanel());
      return wrap;
    }

    function contextPanel() {
      const panel = el("div", { class: "context-panel", id: "context-panel" });
      panel.append(el("div", { class: "context-block", "data-section": "Context: Goal" }, [el("div", { class: "context-label", text: "Goal" }), markdownBlock("context-goal", presentation.goal)]));
      const t = presentation.tray || {};
      if (t.keyContext && t.keyContext.length) panel.append(el("div", { class: "context-block", "data-section": "Context: Keep in mind" }, [el("div", { class: "context-label", text: "Keep in mind" }), list(t.keyContext, "context-list")]));
      if (t.runningSummary) panel.append(el("div", { class: "context-block", "data-section": "Context: Running summary" }, [el("div", { class: "context-label", text: "Running summary" }), markdownBlock("context-summary", t.runningSummary)]));
      if (t.openQuestions && t.openQuestions.length) panel.append(el("div", { class: "context-block", "data-section": "Context: Open questions" }, [el("div", { class: "context-label", text: "Open questions" }), list(t.openQuestions, "context-list")]));
      return el("div", { class: "context" }, panel);
    }

    function chunkBody(chunk, disclosureScope = "") {
      const nodes = [mdInline("h1", { class: "title", tabindex: "-1" }, chunk.title)];
      if (chunk.purpose) nodes.push(markdownBlock("purpose", chunk.purpose));
      nodes.push(markdownBlock("lede", chunk.mainPoint));
      if (chunk.keyPoints && chunk.keyPoints.length) nodes.push(list(chunk.keyPoints, "points"));
      if (chunk.details) nodes.push(markdownBlock("detail", chunk.details));
      if (chunk.remember && chunk.remember.length) {
        const anchors = el("div", { class: "anchors" }, el("div", { class: "context-label", text: "Worth remembering" }));
        anchors.append(chunk.remember.length === 1 ? markdownBlock("", chunk.remember[0]) : list(chunk.remember, ""));
        nodes.push(anchors);
      }
      if (chunk.sources && chunk.sources.length) {
        const sources = el("ul", { class: "source-list" }, chunk.sources.map(s => el("li", {}, el("a", { href: s.url, target: "_blank", rel: "noreferrer" }, inlineMarkdown(s.label)))));
        nodes.push(disclosure("Sources (" + chunk.sources.length + ")", sources, "", disclosureScope ? disclosureScope + ":sources" : ""));
      }
      return nodes;
    }

    function disclosure(summaryText, body, extraClass = "", key = "", defaultOpen = false) {
      const node = el("details", { class: "disclose " + extraClass }, [el("summary", { text: summaryText }), body]);
      if (defaultOpen) node.open = true;
      return key ? bindDisclosure(node, key) : node;
    }

    function chunkScreen(chunk, index) {
      const draft = chunkState(index);
      const frag = el("div", {}, el("div", { class: "reading", "data-section": "Section: " + chunk.title }, chunkBody(chunk, "chunk:" + index)));
      if (chunk.decision) frag.append(el("div", { class: "inline-decision" }, [decisionIntro(chunk.decision, "h2"), decisionBlock(chunk.decision, "chunk:" + index)]));

      const respondBody = el("div", { class: "disclose-body" });
      const usesCheckpoint = Boolean(chunk.checkpoint);
      if (usesCheckpoint) respondBody.append(markdownBlock("prompt", chunk.checkpoint));
      const field = el("textarea", { "aria-label": usesCheckpoint ? "Response to checkpoint" : "Note", placeholder: usesCheckpoint ? "Optional — a short answer or reflection" : "Optional note or question" });
      field.value = usesCheckpoint ? (draft.checkpoint || "") : (draft.note || "");
      field.addEventListener("input", () => { if (usesCheckpoint) draft.checkpoint = field.value; else draft.note = field.value; save(); });
      respondBody.append(field);

      const flag = el("input", { type: "checkbox" });
      flag.checked = draft.status === "revisit";
      flag.addEventListener("change", () => { draft.status = flag.checked ? "revisit" : ""; save(); });
      respondBody.append(el("label", { class: "flag" }, [flag, el("span", { text: "Flag this section for follow-up" })]));

      frag.append(disclosure("Respond", respondBody, "respond", "chunk:" + index + ":respond", usesCheckpoint));
      return frag;
    }

    function decisionIntro(decision, heading = "h1") {
      const intro = el("div", { class: "reading", "data-section": "Decision: " + decision.question }, [el("span", { class: "tag", text: "Decision" }), mdInline(heading, { class: "title", tabindex: "-1" }, decision.question)]);
      if (decision.context) intro.append(markdownBlock("purpose", decision.context));
      return intro;
    }

    function optionBody(option) {
      const title = el("div", {}, [mdInline("span", { class: "option-title" }, option.label)]);
      if (option.recommended) title.append(el("span", { class: "recommended", text: "Recommended" }));
      const body = el("div", {}, title);
      if (option.description) body.append(markdownBlock("option-desc", option.description));
      if (option.tradeoffs && option.tradeoffs.length) body.append(list(option.tradeoffs, "tradeoffs"));
      return body;
    }

    // Options, guidance, and the validation error for one decision (at most one per screen).
    function decisionBlock(decision, key) {
      const draft = decisionState(key);
      const frag = el("div", {});
      const slug = String(key).replace(/[^a-z0-9]+/gi, "-");
      const options = el("div", { class: "options" });
      decision.options.forEach((option, optionIndex) => {
        const id = "decision-" + slug + "-" + optionIndex;
        const radio = el("input", { id, type: "radio", name: "decision-" + slug, value: option.label });
        radio.checked = draft.selected === option.label;
        radio.addEventListener("change", () => { draft.selected = option.label; save(); document.getElementById("decision-error")?.classList.remove("visible"); });
        options.append(el("label", { class: "option", for: id }, [radio, optionBody(option)]));
      });
      frag.append(options);

      const note = el("textarea", { "aria-label": "Guidance for this decision", placeholder: "Constraints, concerns, or an alternative" });
      note.value = draft.note || "";
      note.addEventListener("input", () => { draft.note = note.value; save(); });
      frag.append(disclosure("Add guidance", note, "", "decision:" + key + ":guidance"));
      frag.append(el("div", { class: "error", id: "decision-error", role: "alert", text: "Choose an option before continuing, or add guidance instead." }));
      return frag;
    }

    function decisionScreen(decision, index) {
      return el("div", {}, [decisionIntro(decision), decisionBlock(decision, index)]);
    }

    // --- Notes panel: free-standing notes, not tied to any section ---
    function setNotesOpen(open) {
      notesOpen = open;
      try { localStorage.setItem(NOTES_OPEN_KEY, open ? "1" : "0"); } catch { /* storage unavailable */ }
    }
    const notesButtonText = () => state.notes.length ? "Notes · " + state.notes.length : "Notes";
    // Swap only the panel and the header count so focus and scroll elsewhere survive.
    function refreshNotes(focusSelector) {
      const button = document.getElementById("notes-toggle");
      if (button) { button.textContent = notesButtonText(); button.setAttribute("aria-expanded", String(notesOpen)); }
      const existing = document.getElementById("notes-panel");
      const fresh = notesOpen && !submitted ? notesPanel() : null;
      const field = document.getElementById("note-composer");
      if (existing && fresh && field && document.activeElement === field && !noteEditing) {
        // Keep the focused composer in place: swapping it out blurs and refocuses,
        // which on iOS Safari hides and re-shows the keyboard and can leave the
        // fixed sheet pushed under the keyboard bar.
        existing.querySelector(".notes-list").replaceWith(fresh.querySelector(".notes-list"));
        field.value = noteDraft;
      }
      else if (existing && fresh) existing.replaceWith(fresh);
      else if (existing) existing.remove();
      else if (fresh) app.append(fresh);
      layoutNotes();
      // Focus synchronously: iOS only raises the keyboard for a focus made inside the tap handler.
      if (focusSelector) document.querySelector(focusSelector)?.focus();
    }
    // As a bottom sheet the panel would cover the Back/Next bar, so lift the bar above it.
    const notesDocked = matchMedia("(min-width: 1200px)");
    function layoutNotes() {
      const panel = document.getElementById("notes-panel");
      let lift = 0;
      if (panel && !notesDocked.matches) {
        // Size the sheet against the visible viewport, not the layout one, so that with the
        // keyboard up it still leaves room for the nav: half the visible height, but never less
        // than its head plus composer need.
        const view = visibleRect();
        panel.style.maxHeight = Math.min(view.height, Math.max(view.height / 2, 260)) + "px";
        const bottom = Math.max(0, window.innerHeight - view.top - view.height);
        panel.style.bottom = bottom + "px";
        lift = bottom + panel.offsetHeight;
      } else if (panel) {
        panel.style.maxHeight = "";
        panel.style.bottom = "";
      }
      document.documentElement.style.setProperty("--sheet", lift + "px");
    }
    notesDocked.addEventListener("change", layoutNotes);
    window.addEventListener("resize", layoutNotes);
    // Fixed overlays follow the visible viewport while the on-screen keyboard shows or hides.
    // iOS Safari: after the keyboard closes, the visual viewport can also stay offset from the
    // layout viewport, so fixed elements are drawn in one place and hit-tested in another until
    // the page scrolls; a one-pixel scroll and back re-syncs the two (a zero-distance scroll is
    // ignored), once the keyboard animation has settled.
    if (window.visualViewport) {
      let viewportHeight = visualViewport.height;
      const relayout = () => {
        layoutNotes();
        if (composer && composerRect) clampBelowAbove(composer, composerRect);
      };
      visualViewport.addEventListener("scroll", relayout);
      visualViewport.addEventListener("resize", () => {
        const grew = visualViewport.height > viewportHeight;
        viewportHeight = visualViewport.height;
        relayout();
        if (grew) setTimeout(() => { window.scrollBy(0, 1); window.scrollBy(0, -1); relayout(); }, 50);
      });
    }
    // A button that acts on the focused note field must not steal its focus: the keyboard would
    // drop and re-raise, moving every fixed overlay under a fast tap sequence.
    const keepFocus = button => { button.addEventListener("pointerdown", event => event.preventDefault()); return button; };
    function toggleNotes(open = !notesOpen) {
      setNotesOpen(open);
      refreshNotes(open ? "#note-composer" : "#notes-toggle");
    }
    // The review screen lists notes too, so it re-renders; elsewhere only the panel changes.
    function notesChanged(focusSelector) {
      save();
      if (!overview && current >= screens.length) { pendingFocus = focusSelector || null; render(); }
      else refreshNotes(focusSelector);
    }
    function addNote() {
      const text = noteDraft.trim();
      if (!text) return;
      state.notes.push({ id: uid(), text });
      noteDraft = "";
      notesChanged("#note-composer");
    }
    function editNote(id) {
      noteEditing = id;
      setNotesOpen(true);
      refreshNotes('[data-note-editor="' + id + '"]');
    }
    function deleteNote(id) {
      state.notes = state.notes.filter(n => n.id !== id);
      if (noteEditing === id) noteEditing = null;
      notesChanged("#note-composer");
    }
    function noteItem(note) {
      return el("div", { class: "note-item", "data-note-id": note.id }, [
        markdownBlock("", note.text),
        el("div", { class: "note-actions" }, [
          el("button", { class: "link-edit", type: "button", text: "Edit", onclick: () => editNote(note.id) }),
          el("button", { class: "link-danger", type: "button", text: "Delete", "aria-label": "Delete note", onclick: event => requestDelete(event.currentTarget, "note", () => deleteNote(note.id)) }),
        ]),
      ]);
    }
    function noteEditor(note) {
      const field = el("textarea", { "aria-label": "Edit note", "data-note-editor": note.id });
      field.value = note.text;
      const commit = () => {
        const text = field.value.trim();
        noteEditing = null;
        if (text) note.text = text; else state.notes = state.notes.filter(n => n !== note);
        notesChanged("#note-composer");
      };
      // Focus returns to the composer (not the Edit button) so a touch keyboard stays up.
      const cancel = () => { noteEditing = null; refreshNotes("#note-composer"); };
      field.addEventListener("keydown", event => {
        if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) { event.preventDefault(); commit(); }
        else if (event.key === "Escape") { event.preventDefault(); event.stopPropagation(); cancel(); }
      });
      return el("div", { class: "note-editor" }, [field, el("div", { class: "notes-actions" }, [
        keepFocus(el("button", { class: "btn", type: "button", text: "Cancel", onclick: cancel })),
        keepFocus(el("button", { class: "btn primary", type: "button", text: "Save", onclick: commit })),
      ])]);
    }
    function notesPanel() {
      const panel = el("aside", { id: "notes-panel", class: "notes", "aria-label": "Notes" });
      panel.append(el("div", { class: "notes-head" }, [
        el("span", { class: "notes-title", text: "Notes" }),
        el("button", { class: "ghost notes-close", type: "button", text: "Close", "aria-label": "Close notes", onclick: () => toggleNotes(false) }),
      ]));
      const list = el("div", { class: "notes-list" });
      if (!state.notes.length) list.append(el("p", { class: "notes-empty", text: "Thoughts, questions, or tangents that are not about any one section. They go back with your response." }));
      state.notes.forEach(note => list.append(noteEditing === note.id ? noteEditor(note) : noteItem(note)));
      panel.append(list);
      // While a note is being edited its editor stands in for the composer, which frees the
      // room a short (keyboard-up) sheet needs to show the editor and its actions.
      if (noteEditing && state.notes.some(n => n.id === noteEditing)) return panel;
      const field = el("textarea", { id: "note-composer", "aria-label": "New note", placeholder: "A thought, question, or tangent — not tied to any section" });
      field.value = noteDraft;
      field.addEventListener("input", () => { noteDraft = field.value; });
      field.addEventListener("keydown", event => { if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) { event.preventDefault(); addNote(); } });
      const isMac = /Mac|iPhone|iPad/.test(navigator.platform || "");
      panel.append(el("div", { class: "notes-composer" }, [
        field,
        el("div", { class: "notes-actions" }, [
          el("span", { class: "notes-hint", text: (isMac ? "⌘" : "Ctrl+") + "Enter to add" }),
          keepFocus(el("button", { class: "btn primary", type: "button", text: "Add note", onclick: addNote })),
        ]),
      ]));
      return panel;
    }

    function reviewScreen() {
      const frag = el("div", {}, [
        el("span", { class: "tag", text: "Review" }),
        mdInline("h1", { class: "title", tabindex: "-1" }, presentation.completionPrompt || "Submit"),
        el("p", { class: "purpose", text: "Only what is listed here is returned — your answers, decisions, comments, notes, and anything flagged for follow-up." }),
      ]);
      const grid = el("div", { class: "review" });
      presentation.chunks.forEach((chunk, index) => {
        const draft = chunkState(index);
        if (!draft.note && !draft.checkpoint && draft.status !== "revisit") return;
        const pieces = [];
        if (draft.status === "revisit") pieces.push("Flagged for follow-up");
        if (draft.checkpoint) pieces.push(draft.checkpoint);
        if (draft.note) pieces.push(draft.note);
        grid.append(el("div", { class: "review-item" }, [mdInline("strong", {}, chunk.title), markdownBlock("", pieces.join("\n\n"))]));
      });
      allDecisions().forEach(({ decision, key }) => {
        const draft = decisionState(key);
        if (!draft.selected && !draft.note) return;
        grid.append(el("div", { class: "review-item" }, [mdInline("strong", {}, decision.question), markdownBlock("", (draft.selected || "No option selected") + (draft.note ? "\n\n" + draft.note : ""))]));
      });
      state.annotations.forEach(a => {
        const children = [
          el("strong", { text: "Comment · " + a.location }),
          a.target ? el("div", { class: "target-meta", text: richLocation(a.target) }) : null,
          el("blockquote", { class: "comment-quote", text: a.quote }),
          markdownBlock("", a.comment),
          el("div", { class: "review-actions" }, [
            el("button", { class: "link-edit", type: "button", text: "Edit", onclick: event => openEditComposer(a.id, event.currentTarget.getBoundingClientRect()) }),
            el("button", { class: "link-danger", type: "button", text: "Delete", onclick: event => requestDeleteAnnotation(a.id, event.currentTarget) }),
          ]),
        ];
        grid.append(el("div", { class: "review-item" }, children));
      });
      state.notes.forEach(note => {
        if (!note.text.trim()) return;
        grid.append(el("div", { class: "review-item" }, [
          el("strong", { text: "Note" }),
          markdownBlock("", note.text),
          el("div", { class: "review-actions" }, [
            el("button", { class: "link-edit", type: "button", text: "Edit", onclick: () => editNote(note.id) }),
            el("button", { class: "link-danger", type: "button", text: "Delete", "aria-label": "Delete note", onclick: event => requestDelete(event.currentTarget, "note", () => deleteNote(note.id)) }),
          ]),
        ]));
      });
      if (!grid.children.length) frag.append(el("p", { class: "review-empty", text: "Nothing recorded yet. You can still add an overall response below." }));
      else frag.append(grid);

      const overall = el("textarea", { "aria-label": "Overall response", placeholder: "Optional overall response, question, or correction" });
      overall.value = state.overallNote || "";
      overall.addEventListener("input", () => { state.overallNote = overall.value; save(); });
      frag.append(disclosure("Overall response", overall, "", "review:overall"));
      frag.append(el("div", { class: "error", id: "submit-error", role: "alert", text: submitErrorText("") }));
      return frag;
    }

    function renderOverview() {
      const main = el("main", {});
      main.append(el("div", { class: "overview-head" }, [
        el("h1", { class: "title", text: "All content", tabindex: "-1" }),
        el("button", { class: "btn", text: "Back to paced view", onclick: () => { overview = false; render(); } }),
      ]));
      presentation.chunks.forEach((chunk, i) => {
        const item = el("div", { class: "overview-item", "data-section": "Section: " + chunk.title }, chunkBody(chunk));
        item.querySelectorAll("details.disclose").forEach(d => d.open = true);
        if (chunk.decision) item.append(el("div", { class: "inline-decision" }, [decisionIntro(chunk.decision, "h2"), overviewOptions(chunk.decision)]));
        main.append(item);
      });
      presentation.decisions.forEach((decision, i) => {
        main.append(el("div", { class: "overview-item" }, [decisionIntro(decision), overviewOptions(decision)]));
      });
      return main;
    }
    const overviewOptions = decision => el("div", { class: "options" }, decision.options.map(option => el("div", { class: "option" }, optionBody(option))));

    function currentScreenValid() {
      const pending = screenDecision(screens[current]);
      if (!pending) return true;
      const draft = decisionState(pending.key);
      if (pending.decision.required === false || draft.selected || draft.note.trim()) return true;
      const error = document.getElementById("decision-error");
      error?.classList.add("visible");
      // "end" plus the scroll margin keeps it clear of the sticky nav.
      error?.scrollIntoView({ block: "end" });
      return false;
    }

    const submitErrorText = detail => "Could not submit this briefing" + detail + ". Your notes are saved; try Submit again. If the agent's process is gone, ask it to run await_briefing with id " + presentation.id + " to reopen this briefing.";

    async function finish() {
      const payload = {
        chunks: presentation.chunks.map((chunk, index) => ({
          title: chunk.title,
          status: chunkState(index).status || "unmarked",
          checkpoint: chunkState(index).checkpoint.trim(),
          note: chunkState(index).note.trim(),
        })).filter(item => item.status !== "unmarked" || item.checkpoint || item.note),
        decisions: allDecisions().map(({ decision, key }) => ({
          question: decision.question,
          selected: decisionState(key).selected,
          note: decisionState(key).note.trim(),
        })).filter(item => item.selected || item.note),
        annotations: (state.annotations || []).map(a => ({ location: a.location, quote: a.quote, comment: a.comment, ...(a.target ? { target: a.target } : {}) })).filter(a => a.quote && a.comment),
        notes: state.notes.map(n => n.text.trim()).filter(Boolean),
        overallNote: (state.overallNote || "").trim(),
      };
      try {
        const response = await fetch("/api/" + presentation.token + "/complete", {
          method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload),
        });
        if (!response.ok) throw new Error("HTTP " + response.status);
        localStorage.removeItem(storageKey());
        submitted = true;
        render();
      } catch (error) {
        const banner = document.getElementById("submit-error");
        if (banner) {
          banner.textContent = submitErrorText(" (" + errorMessage(error) + ")");
          banner.classList.add("visible");
        }
      }
    }

    async function cancel() {
      if (!confirm("Cancel this briefing?")) return;
      try {
        await fetch("/api/" + presentation.token + "/cancel", { method: "POST", headers: { "content-type": "application/json" }, body: "{}" });
      } finally {
        localStorage.removeItem(storageKey());
        submitted = true;
        renderDone(true);
      }
    }

    function renderDone(cancelled = false) {
      closeComposer(false);
      hidePopover();
      cleanupExternalRenderArtifacts();
      const idLine = el("p", {}, [document.createTextNode("Briefing id "), el("code", { text: presentation.id }), document.createTextNode(cancelled ? "." : ". If the agent lost track, ask it to run await_briefing with this id; the response is kept for a few hours.")]);
      app.replaceChildren(el("div", { class: "done" }, el("div", { class: "done-card" }, [
        el("div", { class: "done-icon", text: cancelled ? "×" : "✓" }),
        el("h1", { text: cancelled ? "Briefing cancelled" : "Submitted" }),
        el("p", { text: cancelled ? "You can close this tab." : "Your response has been submitted. You can close this tab." }),
        idLine,
      ])));
    }

    function applyFocus() {
      const target = pendingFocus;
      pendingFocus = null;
      requestAnimationFrame(() => {
        const node = (target && document.querySelector(target)) || document.querySelector("main h1") || document.querySelector("h1");
        node?.focus();
      });
    }

    function render() {
      captureDisclosureState();
      hideCommentButton();
      cleanupExternalRenderArtifacts();
      if (submitted) { renderDone(); return; }
      const frag = document.createDocumentFragment();
      frag.append(header());

      if (overview) frag.append(renderOverview());
      else frag.append(pacedMain());
      if (notesOpen) frag.append(notesPanel());
      app.replaceChildren(frag);
      layoutNotes();
      decorateHighlights();
      applyFocus();
    }

    function pacedMain() {
      const main = el("main", {});
      const isReview = current >= screens.length;
      if (isReview) main.append(reviewScreen());
      else {
        const screen = screens[current];
        main.append(screen.type === "chunk" ? chunkScreen(screen.data, screen.index) : decisionScreen(screen.data, screen.index));
      }

      const back = el("button", { class: "btn", text: "Back", disabled: current === 0, onclick: () => { current = Math.max(0, current - 1); save(); render(); } });
      const next = el("button", { class: "btn primary", text: isReview ? "Submit" : current === screens.length - 1 ? "Review" : "Next", onclick: () => {
        if (isReview) { finish(); return; }
        if (!currentScreenValid()) return;
        current = Math.min(screens.length, current + 1); save(); render();
      }});
      main.append(el("nav", { class: "nav", "aria-label": "Briefing navigation" }, [
        back,
        el("button", { class: "link-danger", text: "Cancel", onclick: cancel }),
        el("span", { class: "spacer" }),
        next,
      ]));
      return main;
    }

    document.addEventListener("keydown", event => {
      if (event.target instanceof HTMLTextAreaElement || event.target instanceof HTMLInputElement || overview || submitted || event.shiftKey) return;
      if (event.key === "ArrowLeft" && current > 0) { current--; save(); render(); }
      if (event.key === "ArrowRight" && current < screens.length && currentScreenValid()) { current++; save(); render(); }
    });

    (async () => {
      try {
        const token = location.pathname.split("/").filter(Boolean).pop();
        const response = await fetch("/api/" + token + "/presentation", { cache: "no-store" });
        if (!response.ok) throw new Error("Presentation unavailable");
        presentation = await response.json();
        presentation.token = token;
        presentation.decisions ||= [];
        document.title = presentation.title + " - Briefing";
        if (presentation.status !== "active") {
          submitted = true;
          renderDone(presentation.status === "cancelled");
          return;
        }
        screens = [
          ...presentation.chunks.map((data, index) => ({ type: "chunk", data, index })),
          ...presentation.decisions.map((data, index) => ({ type: "decision", data, index })),
        ];
        restore();
        render();
      } catch (error) {
        app.replaceChildren(el("div", { class: "done" }, el("div", { class: "done-card" }, [el("h1", { text: "Briefing unavailable" }), el("p", { text: String(error.message || error) })])));
      }
    })();
  </script>
</body>
</html>
