<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Briefing</title>
  <style nonce="{{NONCE}}">
    :root {
      --bg: #f7f5f0;
      --surface: #ffffff;
      --text: #232120;
      --muted: #706b63;
      --line: #e8e3d9;
      --line-strong: #d8d2c6;
      --accent: #2f665c;
      --accent-soft: #e6efec;
      --danger: #8a4b24;
      --danger-soft: #f4e6da;
      --focus: color-mix(in srgb, var(--accent) 34%, transparent);
      --radius: 14px;
      --content: 640px;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17191a;
        --surface: #202324;
        --text: #ecebe6;
        --muted: #a8a39a;
        --line: #33363a;
        --line-strong: #43474b;
        --accent: #8ac7bb;
        --accent-soft: #26332f;
        --danger: #e6a878;
        --danger-soft: #3d2c22;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6; -webkit-font-smoothing: antialiased; }
    button, textarea, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    a { color: var(--accent); }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }

    /* Header */
    .header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
    .header-inner { max-width: var(--content); margin: 0 auto; padding: 12px clamp(16px, 5vw, 28px); }
    .header-row { display: flex; align-items: center; gap: 12px; }
    .wordmark { display: flex; align-items: center; gap: 8px; font-weight: 650; letter-spacing: -.01em; font-size: .95rem; }
    .wordmark .mark { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; background: var(--accent); color: var(--bg); font-size: .85rem; }
    .header-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; }
    .ghost { border: 0; background: transparent; color: var(--muted); padding: 6px 10px; border-radius: 8px; font-size: .85rem; font-weight: 550; }
    .ghost:hover { color: var(--text); background: var(--line); }
    .progress-line { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
    .progress { flex: 1; height: 4px; border-radius: 99px; background: var(--line-strong); overflow: hidden; }
    .progress-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width .25s ease; }
    .progress-step { color: var(--muted); font-size: .78rem; font-variant-numeric: tabular-nums; white-space: nowrap; }

    /* Context disclosure */
    .context { max-width: var(--content); margin: 0 auto; padding: 0 clamp(16px, 5vw, 28px); }
    .context-panel { margin-top: 10px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
    .context-block + .context-block { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
    .context-label { font-size: .72rem; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 650; margin-bottom: 6px; }
    .context-goal { font-size: .98rem; font-weight: 550; }
    .context-list { margin: 0; padding-left: 1.15rem; color: var(--muted); }
    .context-list li + li { margin-top: 5px; }
    .context-summary { margin: 0; color: var(--muted); white-space: pre-wrap; }

    /* Main */
    /* With the notes sheet open the bottom padding covers the sheet, so the nav can always scroll
       clear of it and, fully scrolled, sits just above it. */
    main { max-width: var(--content); margin: 0 auto; padding: clamp(24px, 5vw, 40px) clamp(16px, 5vw, 28px) max(120px, calc(var(--sheet, 0px) + 16px)); }
    .tag { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-size: .72rem; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; }
    h1.title { margin: 14px 0 0; font-size: clamp(1.5rem, 4vw, 2rem); line-height: 1.2; letter-spacing: -.02em; font-weight: 680; outline: none; }
    h2.title { margin: 10px 0 0; font-size: clamp(1.2rem, 3vw, 1.45rem); line-height: 1.25; letter-spacing: -.015em; font-weight: 660; outline: none; }
    .purpose { margin: 8px 0 0; color: var(--muted); font-size: 1rem; }
    .lede { margin: 22px 0 0; font-size: 1.12rem; line-height: 1.55; white-space: pre-wrap; }
    .detail { margin: 20px 0 0; padding-top: 18px; border-top: 1px solid var(--line); }
    .points { margin: 20px 0 0; padding-left: 1.2rem; }
    .points li { margin-top: 8px; }
    .points li::marker { color: var(--accent); }

    /* Quiet inline anchors */
    .anchors { margin: 22px 0 0; padding: 12px 16px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 10px 10px 0; }
    .anchors .context-label { color: var(--accent); }
    .anchors ul { margin: 0; padding-left: 1.05rem; }
    .anchors li + li { margin-top: 4px; }
    .anchors p { margin: 0; }

    /* Disclosures */
    details.disclose { margin: 18px 0 0; }
    details.disclose > summary { list-style: none; display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-weight: 550; font-size: .92rem; cursor: pointer; padding: 4px 0; }
    details.disclose > summary::-webkit-details-marker { display: none; }
    details.disclose > summary::before { content: "›"; display: inline-block; transition: transform .15s ease; font-size: 1.1em; }
    details.disclose[open] > summary::before { transform: rotate(90deg); }
    .disclose-body { margin-top: 12px; color: var(--text); white-space: pre-wrap; }
    .source-list { margin: 10px 0 0; padding-left: 1.15rem; color: var(--muted); }
    .source-list li { margin-top: 4px; }

    /* Rich Markdown */
    .markdown { white-space: normal; overflow-wrap: anywhere; }
    .markdown > :first-child { margin-top: 0; }
    .markdown > :last-child { margin-bottom: 0; }
    .markdown p { margin: .75em 0 0; white-space: pre-wrap; }
    .markdown ul, .markdown ol { margin: .75em 0 0; padding-left: 1.2rem; }
    .markdown li { white-space: normal; }
    .markdown li + li { margin-top: .35em; }
    .markdown blockquote { margin: .85em 0 0; padding-left: 14px; border-left: 3px solid var(--line-strong); color: var(--muted); }
    .markdown hr { margin: 1.1em 0; border: 0; border-top: 1px solid var(--line); }
    .markdown strong { font-weight: 700; }
    .markdown em { font-style: italic; }
    .markdown a { overflow-wrap: anywhere; }
    .markdown table { width: 100%; margin: 1em 0 0; border-collapse: collapse; font-size: .94rem; display: block; overflow-x: auto; }
    .markdown th, .markdown td { padding: 8px 10px; border: 1px solid var(--line); vertical-align: top; }
    .markdown th { background: var(--accent-soft); color: var(--text); font-weight: 650; text-align: left; }
    .markdown tr:nth-child(even) td { background: color-mix(in srgb, var(--surface) 72%, var(--line)); }
    .markdown code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: .92em; background: var(--line); border-radius: 5px; padding: .1em .35em; }
    .markdown pre { margin: .85em 0 0; padding: 12px 14px; overflow-x: auto; background: color-mix(in srgb, var(--surface) 72%, var(--line)); border: 1px solid var(--line); border-radius: 10px; line-height: 1.45; }
    .markdown pre code { display: block; padding: 0; background: transparent; border-radius: 0; white-space: pre; }
    .markdown .hljs-keyword, .markdown .hljs-selector-tag, .markdown .hljs-title.function_ { color: #6f42c1; }
    .markdown .hljs-string, .markdown .hljs-attr, .markdown .hljs-symbol { color: #0a6b44; }
    .markdown .hljs-number, .markdown .hljs-literal { color: #9a4f00; }
    .markdown .hljs-comment { color: var(--muted); font-style: italic; }
    .markdown kbd { padding: .1em .4em; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 5px; background: var(--surface); font-family: inherit; font-size: .86em; }
    .render-error { margin: .9em 0 0; padding: 12px 14px; border: 1px solid var(--danger); border-radius: 10px; background: var(--danger-soft); color: var(--danger); }
    .render-error-title { font-weight: 700; }
    .render-error-message { margin-top: 4px; white-space: pre-wrap; }
    .render-error details { margin-top: 8px; }
    .render-error pre { max-height: 220px; margin: 8px 0 0; background: color-mix(in srgb, var(--surface) 70%, var(--danger-soft)); }
    .rich-block { margin: 1.05em 0 0; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
    .rich-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .rich-title { color: var(--muted); font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; font-weight: 650; }
    .rich-actions { margin-left: auto; display: flex; gap: 4px; }
    .rich-comment { border: 1px solid var(--line-strong); background: transparent; color: var(--muted); border-radius: 8px; padding: 4px 9px; font-size: .8rem; font-weight: 600; }
    .rich-comment:hover { color: var(--accent); border-color: var(--accent); }
    .rich-body { overflow-x: auto; }
    .rich-body svg { max-width: 100%; height: auto; display: block; margin: 0 auto; }
    .rich-vega-lite .rich-body, .rich-vega-lite .vega-embed { width: 100%; }
    .rich-targetable { cursor: pointer; }
    .rich-targetable:hover, .rich-targetable.rich-has-comments { filter: drop-shadow(0 0 4px var(--accent)); }
    .rich-comment.has-comments { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
    .vega-embed details { display: none; }

    /* Respond */
    .respond .disclose-body { white-space: normal; }
    .prompt { margin: 0 0 10px; color: var(--muted); }
    textarea { width: 100%; min-height: 84px; resize: vertical; padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); line-height: 1.5; }
    textarea:focus { outline: 3px solid var(--focus); outline-offset: 1px; border-color: var(--accent); }
    .flag { display: flex; align-items: center; gap: 9px; margin-top: 12px; color: var(--muted); cursor: pointer; }
    .flag input { width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; }

    /* Decisions */
    .inline-decision { margin-top: 30px; padding-top: 22px; border-top: 1px solid var(--line); }
    .options { margin: 22px 0 0; display: grid; gap: 10px; }
    .option { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 15px 16px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); cursor: pointer; }
    .option:hover { border-color: var(--accent); }
    .option:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
    .option input { margin-top: 3px; width: 17px; height: 17px; accent-color: var(--accent); }
    .option-title { font-weight: 620; }
    .recommended { margin-left: 8px; color: var(--accent); font-size: .68rem; letter-spacing: .05em; text-transform: uppercase; font-weight: 650; }
    .option-desc { margin-top: 4px; color: var(--muted); font-size: .95rem; }
    .tradeoffs { margin: 8px 0 0; padding-left: 1.05rem; color: var(--muted); font-size: .9rem; }
    .tradeoffs li + li { margin-top: 3px; }

    .error { display: none; margin-top: 16px; padding: 11px 14px; color: var(--danger); background: var(--danger-soft); border-radius: 10px; font-size: .92rem; scroll-margin-bottom: calc(80px + var(--sheet, 0px)); }
    .error.visible { display: block; }

    /* Review */
    .review { margin: 20px 0 0; display: grid; gap: 10px; }
    .review-item { padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
    .review-item strong { display: block; margin-bottom: 4px; }
    .review-item p { margin: 0; color: var(--muted); white-space: pre-wrap; font-size: .95rem; }
    .review-item .markdown { color: var(--muted); font-size: .95rem; }
    .review-item .markdown p + p, .review-item .markdown p + ul, .review-item .markdown ul + p, .review-item .markdown pre + p { margin-top: .75em; }
    .target-meta { margin: -2px 0 6px; color: var(--muted); font-size: .78rem; }
    .review-empty { margin: 20px 0 0; color: var(--muted); }

    /* Navigation */
    .nav { position: sticky; bottom: var(--sheet, 0px); margin-top: 32px; padding: 14px 0; display: flex; align-items: center; gap: 10px; background: linear-gradient(to top, var(--bg) 62%, transparent); }
    .btn { border: 1px solid var(--line-strong); border-radius: 10px; padding: 10px 18px; background: var(--surface); font-weight: 600; }
    .btn:hover:not(:disabled) { border-color: var(--accent); }
    .btn.primary { color: var(--bg); background: var(--accent); border-color: var(--accent); }
    .btn.primary:hover { filter: brightness(1.05); }
    .btn:disabled { opacity: .4; cursor: default; }
    .nav .spacer { flex: 1; }
    .link-danger { border: 0; background: transparent; color: var(--muted); font-size: .85rem; padding: 8px; border-radius: 8px; }
    .link-danger:hover { color: var(--danger); }
    .link-danger.armed { color: var(--danger); background: var(--danger-soft); }
    .review-actions { display: flex; gap: 2px; margin-top: 6px; }
    .link-edit { border: 0; background: transparent; color: var(--muted); font-size: .85rem; padding: 8px; border-radius: 8px; }
    .link-edit:hover { color: var(--accent); }

    /* Overview */
    .overview-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .overview-item { padding: 26px 0; border-bottom: 1px solid var(--line); }
    .overview-item:last-child { border-bottom: 0; }

    /* Done */
    .done { min-height: 70vh; display: grid; place-items: center; text-align: center; padding: 24px; }
    .done-card { max-width: 460px; }
    .done-icon { width: 52px; height: 52px; margin: 0 auto 18px; display: grid; place-items: center; border-radius: 50%; color: var(--bg); background: var(--accent); font-size: 1.5rem; }
    .done h1 { margin: 0 0 10px; font-size: 1.5rem; }
    .done p { margin: 0; color: var(--muted); }
    .done p + p { margin-top: 12px; font-size: .9rem; }
    .done code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; user-select: all; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--fg, #1d1d1f); color: var(--bg, #fff); padding: 10px 16px; border-radius: 10px; font-size: .9rem; box-shadow: 0 6px 24px rgba(0,0,0,.2); z-index: 60; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.visible { opacity: 1; }

    /* Inline annotation highlights */
    .comment-quote { margin: 6px 0; padding-left: 10px; border-left: 3px solid var(--accent); color: var(--text); white-space: pre-wrap; font-style: italic; }
    .anno-mark { background: var(--accent-soft); border-bottom: 1px solid var(--accent); border-radius: 2px; padding: 0 1px; color: inherit; cursor: help; }
    .anno-mark:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
    /* Saved-comment popover sits below the selection Comment action and composer
       (z-index 40/41) so a live text selection can never be covered by it. */
    .anno-tip { position: fixed; z-index: 30; max-width: min(320px, calc(100vw - 24px)); max-height: calc(100vh - 16px); overflow: auto; background: var(--surface); color: var(--text); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.22); padding: 10px 12px; font-size: .9rem; line-height: 1.45; }
    .anno-tip[hidden] { display: none; }
    .anno-tip.pinned { border-color: var(--accent); box-shadow: 0 14px 40px rgba(0,0,0,.28); }
    .anno-tip-item + .anno-tip-item { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
    .anno-tip-loc { font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 650; margin-bottom: 3px; }
    .anno-tip-comment { white-space: pre-wrap; }
    .anno-tip-actions { margin-top: 8px; display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 4px; }
    .anno-tip-edit, .anno-tip-delete { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 4px 12px; font-size: .82rem; font-weight: 600; }
    .anno-tip-edit { color: var(--accent); }
    .anno-tip-edit:hover { border-color: var(--accent); }
    .anno-tip-delete { color: var(--danger); }
    .anno-tip-delete:hover { border-color: var(--danger); }
    .anno-tip-delete.armed { color: var(--danger); border-color: var(--danger); background: var(--danger-soft); }

    /* Selection affordance + composer overlays */
    .comment-fab { position: fixed; z-index: 40; border: 1px solid var(--accent); background: var(--accent); color: var(--bg); border-radius: 10px; padding: 7px 14px; font-size: .85rem; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.22); }
    .comment-fab[hidden] { display: none; }
    .composer { position: fixed; z-index: 41; overflow: auto; width: min(340px, calc(100vw - 24px)); background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius); box-shadow: 0 14px 40px rgba(0,0,0,.28); padding: 16px; }
    .composer-loc { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 650; }
    .composer-excerpt { margin: 6px 0 12px; padding-left: 10px; border-left: 3px solid var(--accent); color: var(--text); white-space: pre-wrap; font-style: italic; max-height: 96px; overflow: auto; }
    .composer-input { width: 100%; min-height: 76px; resize: vertical; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--bg); line-height: 1.5; }
    .composer-input:focus { outline: 3px solid var(--focus); outline-offset: 1px; border-color: var(--accent); }
    .composer-err { display: none; margin-top: 8px; color: var(--danger); font-size: .88rem; }
    .composer-err.visible { display: block; }
    .composer-actions { margin-top: 12px; display: flex; justify-content: flex-end; gap: 8px; }
    .composer-actions .btn { padding: 8px 14px; }

    /* Notes panel: free-standing notes, not tied to any section. A bottom sheet by
       default; docked in the empty left margin when the viewport has room. The
       reading column never moves and the right margin stays free for comments. */
    .notes { position: fixed; z-index: 25; left: 0; right: 0; bottom: 0; max-height: min(100svh, max(50vh, 300px)); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 16px 16px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.18); }
    .notes-head { display: flex; align-items: center; gap: 8px; padding: 10px 16px 6px; }
    .notes-title { font-size: .72rem; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 650; }
    .notes-close { margin-left: auto; }
    .notes-list { flex: 1; min-height: 0; overflow: auto; padding: 0 16px; }
    .notes-empty { margin: 4px 0 10px; color: var(--muted); font-size: .9rem; }
    .note-item, .note-editor { padding: 10px 0; border-top: 1px solid var(--line); }
    .note-item .markdown { font-size: .95rem; }
    .note-actions { display: flex; gap: 2px; margin-top: 4px; }
    .notes-composer { padding: 10px 16px 14px; border-top: 1px solid var(--line); }
    .notes textarea { min-height: 64px; background: var(--bg); }
    .notes-actions { margin-top: 8px; display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
    .notes-actions .btn { padding: 8px 14px; }
    .notes-hint { margin-right: auto; color: var(--muted); font-size: .78rem; }
    @media (pointer: coarse) { .notes-hint { display: none; } }
    @media (min-width: 1200px) {
      .notes { left: 16px; right: auto; top: 88px; bottom: 16px; max-height: none; width: min(320px, calc((100vw - var(--content)) / 2 - 44px)); border-radius: var(--radius); box-shadow: 0 10px 30px rgba(0,0,0,.12); }
    }

    @media (max-width: 560px) {
      .wordmark span:not(.mark) { display: none; }
      .nav { flex-wrap: wrap; }
      .composer { left: 12px !important; right: 12px; width: auto; }
    }
  </style>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <script src="/briefing-assets/marked.umd.js"></script>
  <script src="/briefing-assets/purify.min.js"></script>
  <script src="/briefing-assets/highlight.min.js"></script>
  <script src="/briefing-assets/mermaid.min.js"></script>
  <script src="/briefing-assets/vega.min.js"></script>
  <script src="/briefing-assets/vega-lite.min.js"></script>
  <script src="/briefing-assets/vega-embed.min.js"></script>
  <script nonce="{{NONCE}}">
    "use strict";
    const app = document.getElementById("app");
    let presentation;
    let screens = [];
    let current = 0;
    let overview = false;
    let submitted = false;
    let contextOpen = false;
    let pendingFocus = null;
    let pendingSelection = null;
    let composer = null;
    let composerRect = null;
    let composerReturnFocus = null;
    let state = { chunks: {}, decisions: {}, annotations: [], notes: [], overallNote: "" };
    let disclosureState = {};
    const NOTES_OPEN_KEY = "briefing:notesOpen";
    let notesOpen = (() => { try { return localStorage.getItem(NOTES_OPEN_KEY) === "1"; } catch { return false; } })();
    let noteDraft = "";
    let noteEditing = null;
    const MAX_ANNOTATIONS = 500;
    const MAX_QUOTE = 2000;
    const MAX_COMMENT = 4000;
    const ANCHOR_CONTEXT = 40;
    const MARGIN_RAIL_WIDTH = 300;
    const MARGIN_RAIL_GAP = 28;
    const MARGIN_RAIL_MIN_USABLE = 150;
    const TOUCH_CALLOUT_CLEARANCE = 60;
    const DELETE_ARM_MS = 5000;
    const errorMessage = error => String(error?.message ?? error); // Do not recurse: Safari can optimize tail recursion into an infinite loop, freezing error handling.

    const el = (tag, attrs = {}, children = []) => {
      const node = document.createElement(tag);
      for (const [key, value] of Object.entries(attrs)) {
        if (key === "class") node.className = value;
        else if (key === "text") node.textContent = value;
        else if (key.startsWith("on")) node.addEventListener(key.slice(2).toLowerCase(), value);
        else if (value !== undefined && value !== null && value !== false) node.setAttribute(key, value === true ? "" : String(value));
      }
      for (const child of Array.isArray(children) ? children : [children]) {
        if (child !== undefined && child !== null && child !== false) node.append(child);
      }
      return node;
    };

    let richCounter = 0;
    let mermaidInitialized = false;

    function safeMarkdownUrl(value) {
      const raw = String(value || "").trim();
      if (!raw || /\s/.test(raw)) return null;
      const hasScheme = /^[A-Za-z][A-Za-z0-9+.-]*:/.test(raw);
      const host = raw.split(/[/?#]/, 1)[0].replace(/:\d+$/, "");
      const looksLikeBareDomain = !hasScheme && /^[A-Za-z0-9.-]+(?::\d+)?(?:[/?#].*)?$/.test(raw) && host.includes(".");
      if (!hasScheme && !looksLikeBareDomain) return null;
      try {
        const url = new URL(hasScheme ? raw : "https://" + raw);
        if (url.protocol === "http:" || url.protocol === "https:") return url.href;
      } catch { /* Render invalid markdown links as plain text. */ }
      return null;
    }

    function safeImageUrl(value) {
      const raw = String(value || "").trim();
      if (/^data:image\/(?:png|jpe?g|gif|webp);base64,[A-Za-z0-9+/=]+$/i.test(raw)) return raw;
      return safeMarkdownUrl(raw);
    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
    }

    function markdownApi() {
      const api = window.marked;
      return api && api.parse && api.parseInline && api.Renderer ? api : null;
    }

    // DOMPurify only skips re-parsing its config when handed the same object, so keep one.
    const SANITIZE_HTML = {
      ALLOWED_TAGS: ["p", "br", "strong", "em", "a", "code", "pre", "ul", "ol", "li", "blockquote", "hr", "table", "thead", "tbody", "tr", "th", "td", "span", "div", "kbd", "sup", "sub", "small", "mark", "img", "h1", "h2", "h3", "h4", "h5", "h6"],
      ALLOWED_ATTR: ["href", "title", "target", "rel", "src", "alt", "class", "colspan", "rowspan", "align", "aria-label", "role"],
      ALLOW_DATA_ATTR: true,
      FORBID_ATTR: ["style"],
      FORBID_TAGS: ["script", "style", "iframe", "object", "embed", "form", "input", "button", "textarea", "select"],
    };
    const SANITIZE_SVG = {
      USE_PROFILES: { html: true, svg: true, svgFilters: true },
      ADD_TAGS: ["foreignObject", "style"],
      ADD_ATTR: ["class", "id", "style", "transform", "d", "x", "y", "x1", "y1", "x2", "y2", "width", "height", "viewBox", "xmlns", "role", "aria-label", "marker-end", "marker-start"],
    };

    function sanitize(markup, config) {
      if (!window.DOMPurify) throw new Error("DOMPurify did not load");
      return String(window.DOMPurify.sanitize(String(markup || ""), config));

    const sanitizeHtml = html => sanitize(html, SANITIZE_HTML);
    const sanitizeSvg = svg => sanitize(svg, SANITIZE_SVG);

    function fragmentFromHtml(html) {
      const template = document.createElement("template");
      template.innerHTML = html;
      return template.content.cloneNode(true);
    }

    let markdownRenderer = null;
    function makeMarkdownRenderer() {
      if (markdownRenderer) return markdownRenderer;
      const api = markdownApi();
      if (!api) throw new Error("Marked did not load");
      const renderer = new api.Renderer();
      renderer.link = function(token) {
        const label = this.parser.parseInline(token.tokens || []);
        const href = safeMarkdownUrl(token.href);
        if (!href) return label;
        const title = token.title ? ' title="' + escapeHtml(token.title) + '"' : "";
        return '<a href="' + escapeHtml(href) + '" target="_blank" rel="noreferrer"' + title + '>' + label + '</a>'; 
      };
      renderer.image = function(token) {
        const src = safeImageUrl(token.href);
        const alt = escapeHtml(token.text || "");
        if (!src) return alt;
        const title = token.title ? ' title="' + escapeHtml(token.title) + '"' : "";
        return '<img src="' + escapeHtml(src) + '" alt="' + alt + '"' + title + '>';
      };
      markdownRenderer = renderer;
      return renderer;
    }

    function scopeSanitizedClasses(root) {
      root.querySelectorAll("[class]").forEach(node => {
        if (node.tagName && node.tagName.toLowerCase() === "code") {
          const keep = [...node.classList].filter(cls => cls === "hljs" || cls.startsWith("language-"));
          if (keep.length) node.setAttribute("class", keep.join(" "));
          else node.removeAttribute("class");
          return;
        }
        node.removeAttribute("class");
      });
    }

    function normalizeSanitizedLinks(root) {
      root.querySelectorAll("a[href]").forEach(link => {
        const safe = safeMarkdownUrl(link.getAttribute("href"));
        if (!safe) link.removeAttribute("href");
        else {
          link.setAttribute("href", safe);
          link.setAttribute("target", "_blank");
          link.setAttribute("rel", "noreferrer");
        }
      });
      root.querySelectorAll("img[src]").forEach(image => {
        const safe = safeImageUrl(image.getAttribute("src"));
        if (!safe) image.remove();
        else image.setAttribute("src", safe);
      });
    }

    function renderRichError(title, message, source) {
      const box = el("div", { class: "render-error", role: "alert" }, [
        el("div", { class: "render-error-title", text: title }),
        el("div", { class: "render-error-message", text: message }),
      ]);
      if (source) {
        box.append(el("details", {}, [
          el("summary", { text: "Source" }),
          el("pre", {}, el("code", {}, String(source).slice(0, 12000))),
        ]));
      }
      return box;
    }

    function languageOf(code) {
      for (const cls of code.classList) {
        if (cls.startsWith("language-")) return cls.slice("language-".length).toLowerCase();
      }
      return (code.getAttribute("data-language") || "").toLowerCase();
    }

    function isMermaidLanguage(language) {
      return language === "mermaid";
    }

    function isVegaLiteLanguage(language) {
      return language === "vega-lite" || language === "vegalite" || language === "vl";
    }

    function sourceExcerpt(source) {
      return String(source || "").trim().slice(0, 500);
    }

    function cleanTargetText(value) {
      return String(value || "").replace(/\s+/g, " ").trim();
    }

    function sectionForNode(node) {
      return node.closest("[data-section]")?.getAttribute("data-section") || "Section";
    }

    function normalizeTarget(target) {
      const out = {};
      for (const key of ["section", "contentType", "targetType", "targetId", "targetLabel", "sourceExcerpt"]) {
        const value = cleanTargetText(target && target[key]);
        if (value) out[key] = value.slice(0, 500);

      return out;
    }

    function stableMermaidId(rawId) {
      return cleanTargetText(rawId).replace(/^briefing-mermaid-\d+-/, "");

    function semanticMermaidId(stableId) {
      return cleanTargetText(stableId).replace(/^flowchart-/, "").replace(/-\d+$/, "");
    }

    function mermaidLabelMap(source) {
      const map = new Map();
      const text = String(source || "");
      const pattern = /(^|[\s;])([A-Za-z][A-Za-z0-9_-]*)\s*(?:\[([^\]]+)\]|\(([^)]+)\)|\{([^}]+)\})/g;
      for (const match of text.matchAll(pattern)) {

        const label = cleanTargetText(match[3] || match[4] || match[5] || "").replace(/^['"]|['"]$/g, "");
        if (id && label) map.set(id, label);
