[settings]
# mise.lock pins what "latest" resolved to, so CI and every checkout install the same
# versions; bump with `mise upgrade`.
lockfile = true

[tools]
# Rust lives here (not rust-toolchain.toml) so `mise install` sets up everything the build
# needs, locally and in CI: toolchain, clippy/rustfmt, the three release targets, zig +
# cargo-zigbuild for cross builds, node for the asset embed.
rust = { version = "latest", profile = "minimal", components = ["clippy", "rustfmt"], targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl"] }
"ubi:rust-cross/cargo-zigbuild" = "0.23.4"
node = "latest"
zig = "0.16.0"

[tasks.check]
description = "verify format, generated skill, clippy, and tests"
run = """
set -eu
cargo fmt --all -- --check
generated_skill="$(mktemp)"
trap 'rm -f "$generated_skill"' EXIT
cargo run --quiet --locked -- guidance skill > "$generated_skill"
diff -u skills/briefing/SKILL.md "$generated_skill"
cargo clippy --all-targets --locked -- -D warnings
cargo test --locked
"""

[tasks.fix]
description = "format, apply clippy fixes, and regenerate the skill"
run = """
set -eu
cargo fmt --all
cargo clippy --fix --allow-dirty --allow-staged --all-targets --locked -- -D warnings
cargo fmt --all
cargo run --quiet --locked -- guidance skill > skills/briefing/SKILL.md
"""

[tasks.demo]
description = "Open the bundled demo presentation"
run = "cargo run -- demo"

[tasks."assets:update"]
description = "Bump the embedded browser libraries to their latest versions"
dir = "assets"
run = "npm update --save && npm install --ignore-scripts --no-audit --no-fund"
